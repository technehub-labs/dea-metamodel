name: Validate assessment-models sub-tree

on:
  pull_request:
  push:
    branches: [main]
    paths: ['assessment-models/**']

jobs:
  validate-schemas:
    name: Validate JSON Schemas parse as Draft 2020-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate every schema parses
        run: |
          python -c "
          import json, glob, sys
          from jsonschema import Draft202012Validator
          errors = []
          files = sorted(glob.glob('assessment-models/schemas/*.schema.json'))
          for f in files:
              try:
                  with open(f) as fh:
                      schema = json.load(fh)
                  Draft202012Validator.check_schema(schema)
                  print(f'OK  {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(files)} schemas validated')
          "

  validate-yaml:
    name: Validate vocabulary + examples + maturity YAML parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate YAML files
        run: |
          python -c "
          import yaml, glob, sys
          errors = []
          files = sorted(glob.glob('assessment-models/vocabulary/*.yaml')) + \
                  sorted(glob.glob('assessment-models/examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/v2-beta/*.yaml'))
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'OK  {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(files)} YAML files parsed')
          "

  validate-example-against-schema:
    name: Validate canonical-technology-assessment.yaml + zero-touch-operations-assessment.yaml against assessment-model schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          with open('assessment-models/schemas/common.schema.json') as fh:
              common = json.load(fh)
          with open('assessment-models/schemas/assessment-model.schema.json') as fh:
              am_schema = json.load(fh)

          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          resolver = RefResolver(base_uri='', referrer=am_schema, store=store)
          validator = Draft202012Validator(am_schema, resolver=resolver)

          errors = 0
          for ex in ['assessment-models/examples/canonical-technology-assessment.yaml',
                     'assessment-models/examples/zero-touch-operations-assessment.yaml']:
              with open(ex) as fh:
                  doc = yaml.safe_load(fh)
              errs = sorted(validator.iter_errors(doc), key=lambda e: e.path)
              if errs:
                  errors += 1
                  print(f'FAIL {ex}:')
                  for e in errs:
                      print(f'  path={list(e.path)}: {e.message}')
              else:
                  print(f'OK  {ex}')

          sys.exit(1 if errors else 0)
          "

  validate-result-against-schema:
    name: Validate zero-touch-operations-result.yaml against assessment-result schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          with open('assessment-models/schemas/common.schema.json') as fh:
              common = json.load(fh)
          with open('assessment-models/schemas/assessment-result.schema.json') as fh:
              ar_schema = json.load(fh)

          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          resolver = RefResolver(base_uri='', referrer=ar_schema, store=store)
          validator = Draft202012Validator(ar_schema, resolver=resolver)

          ex = 'assessment-models/examples/zero-touch-operations-result.yaml'
          with open(ex) as fh:
              doc = yaml.safe_load(fh)
          errs = sorted(validator.iter_errors(doc), key=lambda e: e.path)
          if errs:
              for e in errs:
                  print(f'  {ex}: path={list(e.path)}: {e.message}')
              sys.exit(1)
          print(f'OK  {ex}')
          "

  validate-maturity-v2-arithmetic:
    name: Validate maturity v2 band arithmetic + worked example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate bands and worked example
        run: |
          python -c "
          import yaml, sys

          with open('assessment-models/maturity/maturity-bands-v2.yaml') as fh:
              bands_doc = yaml.safe_load(fh)
          with open('assessment-models/maturity/v2-to-v1-legacy-name-map.yaml') as fh:
              map_doc = yaml.safe_load(fh)
          with open('assessment-models/maturity/examples/effort-adjusted-value.yaml') as fh:
              ex_doc = yaml.safe_load(fh)

          errors = []

          # 1. Bands contiguous, non-overlapping, cover 0-100
          bands = bands_doc['bands']
          sorted_bands = sorted(bands, key=lambda b: b['range'][0])
          prev_high = -1
          total_width = 0
          for b in sorted_bands:
              lo, hi = b['range']
              if lo != prev_high + 1:
                  errors.append(f'band {b[\"id\"]}: range starts at {lo}, expected {prev_high + 1}')
              if hi < lo:
                  errors.append(f'band {b[\"id\"]}: invalid range')
              total_width += (hi - lo + 1)
              prev_high = hi
          if total_width != 101:
              errors.append(f'band total points = {total_width}, expected 101 (0–100 inclusive)')

          # 2. Each band has effort_multiplier
          for b in bands:
              if 'effort_multiplier' not in b:
                  errors.append(f'band {b[\"id\"]}: missing effort_multiplier')

          # 3. Effort multipliers are monotonically increasing
          multipliers = [b['effort_multiplier'] for b in sorted_bands]
          if multipliers != sorted(multipliers):
              errors.append(f'effort_multipliers not monotonically increasing: {multipliers}')

          # 4. Legacy-name map has all 5 mappings
          mappings = map_doc['mappings']
          if len(mappings) != 5:
              errors.append(f'legacy-name map has {len(mappings)} entries, expected 5')

          # 5. Worked example: score 80 → value ~49.2
          ex = ex_doc['example']
          # Recompute
          score = ex['inputs']['raw_score']
          band_ranges = [(b['name'], b['range'][0], b['range'][1], b['width'], b['effort_multiplier']) for b in bands]
          value = 0.0
          for name, lo, hi, width, mult in band_ranges:
              if score < lo:
                  pts = 0
              elif score >= hi:
                  pts = width
              else:
                  pts = score - lo + 1
              value += pts / mult

          expected = ex['result']['effort_adjusted_value']
          if abs(value - expected) > ex['acceptance_tolerance']:
              errors.append(f'effort-adjusted value computed {value:.4f} != documented {expected} (tolerance {ex[\"acceptance_tolerance\"]})')

          if errors:
              print('FAIL — maturity v2 validation errors:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)

          print(f'OK  bands: 5 bands, contiguous, total 101 points, multipliers {multipliers}')
          print(f'OK  legacy-name map: 5 entries')
          print(f'OK  worked example: score {score} → effort-adjusted value {value:.4f} (documented {expected}, tolerance {ex[\"acceptance_tolerance\"]})')
          "

  validate-v2-beta-models:
    name: Validate maturity v2-beta model files (CR-MM-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate v2-beta model files
        run: |
          python -c "
          import yaml, glob, sys

          # Load canonical v2 bands and legacy-name map
          with open('assessment-models/maturity/maturity-bands-v2.yaml') as fh:
              bands = yaml.safe_load(fh)['bands']
          with open('assessment-models/maturity/v2-to-v1-legacy-name-map.yaml') as fh:
              mappings = {m['v2_name']: m for m in yaml.safe_load(fh)['mappings']}

          errors = []
          files = sorted(glob.glob('assessment-models/maturity/v2-beta/*.yaml'))
          if len(files) != 5:
              errors.append(f'expected 5 v2-beta files, found {len(files)}: {files}')

          # Required domains (from CR-AM-01 and the five canonical maturity models)
          required_domains = {'enterprise-architecture','modernization','technology','operations','services-delivery'}

          seen_domains = set()
          band_by_id = {b['id']: b for b in bands}

          for f in files:
              with open(f) as fh:
                  doc = yaml.safe_load(fh)
              domain = doc.get('domain')
              seen_domains.add(domain)
              if domain not in required_domains:
                  errors.append(f'{f}: domain {domain!r} not in required set {required_domains}')

              if doc.get('status') != 'beta':
                  errors.append(f'{f}: status must be beta, got {doc.get(\"status\")!r}')
              if doc.get('score_scheme') != 'dea-maturity-v2':
                  errors.append(f'{f}: score_scheme must be dea-maturity-v2, got {doc.get(\"score_scheme\")!r}')
              if not doc.get('band_reference','').endswith('maturity-bands-v2.yaml'):
                  errors.append(f'{f}: band_reference must point to maturity-bands-v2.yaml')

              levels = doc.get('levels', [])
              if len(levels) != 5:
                  errors.append(f'{f}: expected 5 levels, got {len(levels)}')

              for lvl in levels:
                  # Every level must reference an id from the canonical v2 bands
                  if lvl['id'] not in band_by_id:
                      errors.append(f'{f}: level {lvl[\"id\"]!r} not in canonical v2 bands')
                      continue
                  band = band_by_id[lvl['id']]
                  if lvl['name'] != band['name']:
                      errors.append(f'{f}/{lvl[\"id\"]}: name {lvl[\"name\"]!r} != canonical band name {band[\"name\"]!r}')
                  if lvl['score_range'] != band['range']:
                      errors.append(f'{f}/{lvl[\"id\"]}: score_range {lvl[\"score_range\"]} != canonical band range {band[\"range\"]}')
                  if lvl['effort_multiplier'] != band['effort_multiplier']:
                      errors.append(f'{f}/{lvl[\"id\"]}: effort_multiplier {lvl[\"effort_multiplier\"]} != canonical {band[\"effort_multiplier\"]}')

                  # legacy_name must be in the legacy-name map and round-trip
                  ln = lvl.get('legacy_name')
                  if ln is None:
                      errors.append(f'{f}/{lvl[\"id\"]}: missing legacy_name')
                      continue
                  map_entry = mappings.get(lvl['name'])
                  if map_entry is None:
                      errors.append(f'{f}/{lvl[\"id\"]}: no legacy-name map entry for v2 name {lvl[\"name\"]!r}')
                  elif map_entry['v1_name'] != ln:
                      errors.append(f'{f}/{lvl[\"id\"]}: legacy_name {ln!r} != map v1_name {map_entry[\"v1_name\"]!r}')

                  # Required content fields preserved from v1
                  for fld in ('summary','characteristics','exit_criteria','evidence'):
                      if fld not in lvl or not lvl[fld]:
                          errors.append(f'{f}/{lvl[\"id\"]}: missing or empty field {fld!r}')

          missing_domains = required_domains - seen_domains
          if missing_domains:
              errors.append(f'missing v2-beta file(s) for domains: {missing_domains}')

          if errors:
              print('FAIL — v2-beta validation errors:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)

          print(f'OK  {len(files)} v2-beta files validated')
          print(f'OK  domains covered: {sorted(seen_domains)}')
          print(f'OK  every level carries canonical v2 id + name + range + effort_multiplier + legacy_name + content fields')
          "