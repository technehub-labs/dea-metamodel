name: Validate assessment-models sub-tree

on:
  pull_request:
  push:
    branches: [main]
    paths: ['assessment-models/**']

jobs:
  validate-schemas:
    name: Validate JSON Schemas parse as Draft 2020-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate every schema parses
        run: |
          python -c "
          import json, glob, sys
          from jsonschema import Draft202012Validator
          errors = []
          files = sorted(glob.glob('assessment-models/schemas/*.schema.json'))
          for f in files:
              try:
                  with open(f) as fh:
                      schema = json.load(fh)
                  Draft202012Validator.check_schema(schema)
                  print(f'OK  {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(files)} schemas validated')
          "

  validate-yaml:
    name: Validate vocabulary + examples + maturity YAML parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate YAML files
        run: |
          python -c "
          import yaml, glob, sys
          errors = []
          files = sorted(glob.glob('assessment-models/vocabulary/*.yaml')) + \
                  sorted(glob.glob('assessment-models/examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/benchmark/cohort-examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/benchmark/eligibility-examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/benchmark/comparison-examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/v2-beta/*.yaml'))
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'OK  {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'FAIL {f}: {e}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(files)} YAML files parsed')
          "

  validate-example-against-schema:
    name: Validate canonical-technology-assessment.yaml + zero-touch-operations-assessment.yaml against assessment-model schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          with open('assessment-models/schemas/common.schema.json') as fh:
              common = json.load(fh)
          with open('assessment-models/schemas/assessment-model.schema.json') as fh:
              am_schema = json.load(fh)

          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          resolver = RefResolver(base_uri='', referrer=am_schema, store=store)
          validator = Draft202012Validator(am_schema, resolver=resolver)

          errors = 0
          for ex in ['assessment-models/examples/canonical-technology-assessment.yaml',
                     'assessment-models/examples/zero-touch-operations-assessment.yaml']:
              with open(ex) as fh:
                  doc = yaml.safe_load(fh)
              errs = sorted(validator.iter_errors(doc), key=lambda e: e.path)
              if errs:
                  errors += 1
                  print(f'FAIL {ex}:')
                  for e in errs:
                      print(f'  path={list(e.path)}: {e.message}')
              else:
                  print(f'OK  {ex}')

          sys.exit(1 if errors else 0)
          "

  validate-result-against-schema:
    name: Validate zero-touch-operations-result.yaml against assessment-result schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          with open('assessment-models/schemas/common.schema.json') as fh:
              common = json.load(fh)
          with open('assessment-models/schemas/assessment-result.schema.json') as fh:
              ar_schema = json.load(fh)

          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          resolver = RefResolver(base_uri='', referrer=ar_schema, store=store)
          validator = Draft202012Validator(ar_schema, resolver=resolver)

          ex = 'assessment-models/examples/zero-touch-operations-result.yaml'
          with open(ex) as fh:
              doc = yaml.safe_load(fh)
          errs = sorted(validator.iter_errors(doc), key=lambda e: e.path)
          if errs:
              for e in errs:
                  print(f'  {ex}: path={list(e.path)}: {e.message}')
              sys.exit(1)
          print(f'OK  {ex}')
          "

  validate-comparison-against-schema:
    name: Validate benchmark comparison example against benchmark-comparison schema (CR-AM-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          yaml.SafeLoader.add_constructor(
              'tag:yaml.org,2002:timestamp',
              lambda loader, node: loader.construct_scalar(node))

          with open('assessment-models/schemas/common.schema.json') as fh:
              common = json.load(fh)
          with open('assessment-models/schemas/benchmark-comparison.schema.json') as fh:
              bc_schema = json.load(fh)

          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          resolver = RefResolver(base_uri='', referrer=bc_schema, store=store)
          validator = Draft202012Validator(bc_schema, resolver=resolver)

          import glob
          errors = 0
          for ex in sorted(glob.glob('assessment-models/benchmark/comparison-examples/*.yaml')):
              with open(ex) as fh:
                  doc = yaml.safe_load(fh)
              errs = sorted(validator.iter_errors(doc), key=lambda e: e.path)
              if errs:
                  errors += 1
                  print(f'FAIL {ex}:')
                  for e in errs:
                      print(f'  path={list(e.path)}: {e.message}')
              else:
                  print(f'OK  {ex}')
          sys.exit(1 if errors else 0)
          "

  validate-maturity-v2-arithmetic:
    name: Validate maturity v2 band arithmetic + worked example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate bands and worked example
        run: |
          python -c "
          import yaml, sys

          with open('assessment-models/maturity/maturity-bands-v2.yaml') as fh:
              bands_doc = yaml.safe_load(fh)
          with open('assessment-models/maturity/v2-to-v1-legacy-name-map.yaml') as fh:
              map_doc = yaml.safe_load(fh)
          with open('assessment-models/maturity/examples/effort-adjusted-value.yaml') as fh:
              ex_doc = yaml.safe_load(fh)

          errors = []

          # 1. Bands contiguous, non-overlapping, cover 0-100
          bands = bands_doc['bands']
          sorted_bands = sorted(bands, key=lambda b: b['range'][0])
          prev_high = -1
          total_width = 0
          for b in sorted_bands:
              lo, hi = b['range']
              if lo != prev_high + 1:
                  errors.append(f'band {b[\"id\"]}: range starts at {lo}, expected {prev_high + 1}')
              if hi < lo:
                  errors.append(f'band {b[\"id\"]}: invalid range')
              total_width += (hi - lo + 1)
              prev_high = hi
          if total_width != 101:
              errors.append(f'band total points = {total_width}, expected 101 (0–100 inclusive)')

          # 2. Each band has effort_multiplier
          for b in bands:
              if 'effort_multiplier' not in b:
                  errors.append(f'band {b[\"id\"]}: missing effort_multiplier')

          # 3. Effort multipliers are monotonically increasing
          multipliers = [b['effort_multiplier'] for b in sorted_bands]
          if multipliers != sorted(multipliers):
              errors.append(f'effort_multipliers not monotonically increasing: {multipliers}')

          # 4. Legacy-name map has all 5 mappings
          mappings = map_doc['mappings']
          if len(mappings) != 5:
              errors.append(f'legacy-name map has {len(mappings)} entries, expected 5')

          # 5. Worked example: score 80 → value ~49.2
          ex = ex_doc['example']
          # Recompute
          score = ex['inputs']['raw_score']
          band_ranges = [(b['name'], b['range'][0], b['range'][1], b['width'], b['effort_multiplier']) for b in bands]
          value = 0.0
          for name, lo, hi, width, mult in band_ranges:
              if score < lo:
                  pts = 0
              elif score >= hi:
                  pts = width
              else:
                  pts = score - lo + 1
              value += pts / mult

          expected = ex['result']['effort_adjusted_value']
          if abs(value - expected) > ex['acceptance_tolerance']:
              errors.append(f'effort-adjusted value computed {value:.4f} != documented {expected} (tolerance {ex[\"acceptance_tolerance\"]})')

          if errors:
              print('FAIL — maturity v2 validation errors:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)

          print(f'OK  bands: 5 bands, contiguous, total 101 points, multipliers {multipliers}')
          print(f'OK  legacy-name map: 5 entries')
          print(f'OK  worked example: score {score} → effort-adjusted value {value:.4f} (documented {expected}, tolerance {ex[\"acceptance_tolerance\"]})')
          "

  validate-v2-beta-models:
    name: Validate maturity v2-beta model files (CR-MM-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate v2-beta model files
        run: |
          python -c "
          import yaml, glob, sys

          # Load canonical v2 bands and legacy-name map
          with open('assessment-models/maturity/maturity-bands-v2.yaml') as fh:
              bands = yaml.safe_load(fh)['bands']
          with open('assessment-models/maturity/v2-to-v1-legacy-name-map.yaml') as fh:
              mappings = {m['v2_name']: m for m in yaml.safe_load(fh)['mappings']}

          errors = []
          files = sorted(glob.glob('assessment-models/maturity/v2-beta/*.yaml'))
          if len(files) != 5:
              errors.append(f'expected 5 v2-beta files, found {len(files)}: {files}')

          # Required domains (from CR-AM-01 and the five canonical maturity models)
          required_domains = {'enterprise-architecture','modernization','technology','operations','services-delivery'}

          seen_domains = set()
          band_by_id = {b['id']: b for b in bands}

          for f in files:
              with open(f) as fh:
                  doc = yaml.safe_load(fh)
              domain = doc.get('domain')
              seen_domains.add(domain)
              if domain not in required_domains:
                  errors.append(f'{f}: domain {domain!r} not in required set {required_domains}')

              if doc.get('status') != 'beta':
                  errors.append(f'{f}: status must be beta, got {doc.get(\"status\")!r}')
              if doc.get('score_scheme') != 'dea-maturity-v2':
                  errors.append(f'{f}: score_scheme must be dea-maturity-v2, got {doc.get(\"score_scheme\")!r}')
              if not doc.get('band_reference','').endswith('maturity-bands-v2.yaml'):
                  errors.append(f'{f}: band_reference must point to maturity-bands-v2.yaml')

              levels = doc.get('levels', [])
              if len(levels) != 5:
                  errors.append(f'{f}: expected 5 levels, got {len(levels)}')

              for lvl in levels:
                  # Every level must reference an id from the canonical v2 bands
                  if lvl['id'] not in band_by_id:
                      errors.append(f'{f}: level {lvl[\"id\"]!r} not in canonical v2 bands')
                      continue
                  band = band_by_id[lvl['id']]
                  if lvl['name'] != band['name']:
                      errors.append(f'{f}/{lvl[\"id\"]}: name {lvl[\"name\"]!r} != canonical band name {band[\"name\"]!r}')
                  if lvl['score_range'] != band['range']:
                      errors.append(f'{f}/{lvl[\"id\"]}: score_range {lvl[\"score_range\"]} != canonical band range {band[\"range\"]}')
                  if lvl['effort_multiplier'] != band['effort_multiplier']:
                      errors.append(f'{f}/{lvl[\"id\"]}: effort_multiplier {lvl[\"effort_multiplier\"]} != canonical {band[\"effort_multiplier\"]}')

                  # legacy_name must be in the legacy-name map and round-trip
                  ln = lvl.get('legacy_name')
                  if ln is None:
                      errors.append(f'{f}/{lvl[\"id\"]}: missing legacy_name')
                      continue
                  map_entry = mappings.get(lvl['name'])
                  if map_entry is None:
                      errors.append(f'{f}/{lvl[\"id\"]}: no legacy-name map entry for v2 name {lvl[\"name\"]!r}')
                  elif map_entry['v1_name'] != ln:
                      errors.append(f'{f}/{lvl[\"id\"]}: legacy_name {ln!r} != map v1_name {map_entry[\"v1_name\"]!r}')

                  # Required content fields preserved from v1
                  for fld in ('summary','characteristics','exit_criteria','evidence'):
                      if fld not in lvl or not lvl[fld]:
                          errors.append(f'{f}/{lvl[\"id\"]}: missing or empty field {fld!r}')

          missing_domains = required_domains - seen_domains
          if missing_domains:
              errors.append(f'missing v2-beta file(s) for domains: {missing_domains}')

          if errors:
              print('FAIL — v2-beta validation errors:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)

          print(f'OK  {len(files)} v2-beta files validated')
          print(f'OK  domains covered: {sorted(seen_domains)}')
          print(f'OK  every level carries canonical v2 id + name + range + effort_multiplier + legacy_name + content fields')
          "

  validate-relationship-vocabulary:
    name: Validate relationship_type values against vocabulary (CR-AM-01 §41, CR-MM-01.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate relationship_type values
        run: |
          python -c "
          import yaml, glob, sys, re

          with open('assessment-models/vocabulary/relationship-types.yaml') as fh:
              vocab = yaml.safe_load(fh)

          # Build the set of permitted relationship_type ids (canonical + legacy aliases).
          permitted = set()
          for v in vocab['values']:
              permitted.add(v['id'])
          for alias in (vocab.get('legacy_aliases') or {}).keys():
              permitted.add(alias)

          errors = []
          files = sorted(glob.glob('assessment-models/maturity/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/v2-beta/*.yaml')) + \
                  sorted(glob.glob('assessment-models/maturity/examples/*.yaml')) + \
                  sorted(glob.glob('assessment-models/examples/*.yaml'))

          # Just spot-check files that have a 'relationships:' block.
          for f in files:
              with open(f) as fh:
                  doc = yaml.safe_load(fh)
              rels = doc.get('relationships', []) if isinstance(doc, dict) else []
              if not rels:
                  continue
              for r in rels:
                  rt = r.get('relationship_type')
                  if rt is None:
                      continue
                  if rt not in permitted:
                      errors.append(f'{f}: relationship_type {rt!r} not in controlled vocabulary (allowed: {sorted(permitted)})')

          if errors:
              print('FAIL — unregistered relationship_type values:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'OK  all relationship_type values in maturity/* + maturity/v2-beta/* + maturity/examples/* + examples/* are in the controlled vocabulary')
          print(f'OK  permitted set size: {len(permitted)} (canonical: {len(vocab[\"values\"])} + legacy aliases: {len(vocab.get(\"legacy_aliases\") or {})})')
          "

  # CR-MM-02.1 — CR-AM-02 schema set + migration + compatibility tests.
  # Runs the unit tests in assessment-models/tests/{schemas,migration,compatibility}/
  # and the inline legacy-instrument validation against the vendored legacy schema.
  validate-cr-am-02-tests:
    name: CR-AM-02 regression tests (schema set, migration, compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml + jsonschema
        run: pip install pyyaml jsonschema
      - name: Run unittest discovery
        run: python -m unittest discover -v -s assessment-models/tests -t .
      - name: Validate legacy instrument against legacy schema (AC-05)
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator
          with open('assessment-models/migrations/v1-instrument/legacy-instrument.schema.json') as fh:
              legacy_schema = json.load(fh)
          with open('assessment-models/examples/legacy-technology-instrument.yaml') as fh:
              legacy_doc = yaml.safe_load(fh)
          v = Draft202012Validator(legacy_schema)
          errs = list(v.iter_errors(legacy_doc))
          if errs:
              print('FAIL — legacy instrument does not validate against legacy schema:')
              for e in errs[:3]:
                  print(f'  {e.message}')
              sys.exit(1)
          print('OK — legacy instrument validates against legacy schema')
          "
      - name: Validate canonical examples against their schemas (AC-06)
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver
          with open('assessment-models/schemas/common.schema.json') as fh: common = json.load(fh)
          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          cases = [
              ('assessment-models/examples/canonical-technology-assessment.yaml',     'assessment-models/schemas/assessment-model.schema.json'),
              ('assessment-models/examples/zero-touch-operations-assessment.yaml',    'assessment-models/schemas/assessment-model.schema.json'),
              ('assessment-models/migrations/v1-instrument/canonical-technology-migration.yaml', 'assessment-models/schemas/assessment-model.schema.json'),
              ('assessment-models/examples/zero-touch-operations-result.yaml',         'assessment-models/schemas/assessment-result.schema.json'),
          ]
          errors = 0
          for path, schema_path in cases:
              with open(schema_path) as fh: s = json.load(fh)
              resolver = RefResolver(base_uri='', referrer=s, store=store)
              v = Draft202012Validator(s, resolver=resolver)
              doc = yaml.safe_load(open(path))
              errs = list(v.iter_errors(doc))
              if errs:
                  errors += 1
                  print(f'FAIL {path}: {errs[0].message}')
              else:
                  print(f'OK against {schema_path.split(chr(47))[-1]}: {path}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(cases)} canonical examples validate against their schemas')
          "

  validate-migration-integrity:
    name: CR-AM-02 migration integrity (legacy → canonical preserves semantics)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml + jsonschema
        run: pip install pyyaml jsonschema
      - name: Validate mapping + manifest + legacy + canonical round-trip
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          with open('assessment-models/schemas/common.schema.json') as fh: common = json.load(fh)
          with open('assessment-models/schemas/assessment-model.schema.json') as fh: am = json.load(fh)
          with open('assessment-models/migrations/v1-instrument/legacy-instrument.schema.json') as fh: legacy_schema = json.load(fh)
          with open('assessment-models/migrations/v1-instrument/mapping.yaml') as fh: mapping = yaml.safe_load(fh)
          with open('assessment-models/migrations/v1-instrument/canonical-technology-migration.yaml') as fh: canonical = yaml.safe_load(fh)
          with open('assessment-models/migrations/v1-instrument/migration-manifest.yaml') as fh: manifest = yaml.safe_load(fh)
          with open('assessment-models/examples/legacy-technology-instrument.yaml') as fh: legacy_doc = yaml.safe_load(fh)

          errors = 0

          # 1. Legacy schema validates as JSON Schema
          try:
              Draft202012Validator.check_schema(legacy_schema)
              print('OK  legacy schema parses as Draft 2020-12')
          except Exception as e:
              errors += 1
              print(f'FAIL legacy schema parse: {e}')

          # 2. Legacy YAML validates against legacy schema
          v = Draft202012Validator(legacy_schema)
          errs = list(v.iter_errors(legacy_doc))
          if errs:
              errors += 1
              print(f'FAIL legacy YAML does not validate against legacy schema: {errs[0].message}')
          else:
              print('OK  legacy YAML validates against legacy schema (AC-05)')

          # 3. Canonical projection validates against canonical assessment-model schema
          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          resolver = RefResolver(base_uri='', referrer=am, store=store)
          v = Draft202012Validator(am, resolver=resolver)
          errs = list(v.iter_errors(canonical))
          if errs:
              errors += 1
              print(f'FAIL canonical projection does not validate: {errs[0].message}')
          else:
              print('OK  canonical projection validates against assessment-model.schema.json (AC-06)')

          # 4. Round-trip: legacy dimensions count == canonical dimensions count
          legacy_dims = sum(1 for d in legacy_doc['dimensions'])
          canonical_dims = sum(1 for d in canonical['dimensions'])
          if legacy_dims != canonical_dims:
              errors += 1
              print(f'FAIL dimension count mismatch: legacy={legacy_dims} canonical={canonical_dims}')
          else:
              print(f'OK  dimension count preserved: {legacy_dims}')

          # 5. Round-trip: legacy total questions == canonical total questions
          legacy_q = sum(len(d['questions']) for d in legacy_doc['dimensions'])
          canonical_q = sum(len(d['questions']) for d in canonical['dimensions'])
          if legacy_q != canonical_q:
              errors += 1
              print(f'FAIL question count mismatch: legacy={legacy_q} canonical={canonical_q}')
          else:
              print(f'OK  question count preserved: {legacy_q}')

          # 6. Round-trip: legacy maturity_target appears in canonical maturity_models
          legacy_mat_id = legacy_doc['maturity_target']
          canonical_mat_ids = [m['id'] for m in canonical['maturity_models']]
          if legacy_mat_id not in canonical_mat_ids:
              errors += 1
              print(f'FAIL legacy maturity_target {legacy_mat_id!r} not in canonical maturity_models: {canonical_mat_ids}')
          else:
              print(f'OK  legacy maturity_target preserved in canonical maturity_models')

          # 7. Compatibility declaration is the six-axis shape
          comp = canonical.get('compatibility')
          required_axes = {'schema','semantic','scoring','maturity','result','benchmark'}
          if not comp or not required_axes.issubset(set(comp.keys())):
              errors += 1
              print(f'FAIL compatibility declaration missing required axes: {required_axes}')
          else:
              print(f'OK  compatibility declaration declares all six axes (AC-17)')

          # 8. Migration manifest preserves legacy fields that have no canonical equivalent
          manifest_meta = manifest.get('legacy_preserved_metadata', {})
          for legacy_field in ('legacy_total_questions', 'legacy_duration_minutes', 'legacy_facilitator_required'):
              if legacy_field not in manifest_meta:
                  errors += 1
                  print(f'FAIL migration manifest missing {legacy_field}')
          if all(legacy_field in manifest_meta for legacy_field in ('legacy_total_questions', 'legacy_duration_minutes', 'legacy_facilitator_required')):
              print(f'OK  migration manifest preserves all legacy fields without canonical equivalent')

          if errors:
              print(f'--- FAIL: migration integrity errors: {errors}')
              sys.exit(1)
          print(f'--- OK — migration integrity verified (8/8 checks)')
          "
  validate-cr-am-04-result-operations:
    name: CR-AM-04 result operations & maturity interpretation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Run CR-AM-04 result operations conformance suite
        run: |
          python -m unittest -v assessment-models.tests.conformance.test_result_operations assessment-models.tests.conformance.test_result_views

  validate-cr-am-05-views:
    name: CR-AM-05 assessment views & aggregation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate aggregation-model schema parses
        run: |
          python -c "
          import json
          from jsonschema import Draft202012Validator
          for f in ['assessment-models/schemas/aggregation-model.schema.json',
                    'assessment-models/schemas/assessment-view.schema.json']:
              with open(f) as fh:
                  Draft202012Validator.check_schema(json.load(fh))
              print(f'OK  {f}')
          "
      - name: Validate view examples against assessment-view schema
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          # PyYAML parses ISO timestamps as datetime by default; the schema
          # declares date-time as string with format=date-time. Force scalars
          # through the generic constructor to preserve raw strings.
          yaml.SafeLoader.add_constructor(
              'tag:yaml.org,2002:timestamp',
              lambda loader, node: loader.construct_scalar(node),
          )

          with open('assessment-models/schemas/common.schema.json') as fh: common = json.load(fh)
          with open('assessment-models/schemas/assessment-view.schema.json') as fh: av = json.load(fh)
          store = {
            'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
            'common.schema.json': common,
          }
          for path in [
            'assessment-models/views/enterprise/technology-heatmap.yaml',
            'assessment-models/views/capability/technology-architecture-profile.yaml',
            'assessment-models/views/scenario/service-assurance-profile.yaml',
            'assessment-models/views/trend/technology-maturity-trend.yaml',
          ]:
            with open(path) as fh: doc = yaml.safe_load(fh)
            resolver = RefResolver(base_uri='', referrer=av, store=store)
            validator = Draft202012Validator(av, resolver=resolver)
            errs = sorted(validator.iter_errors(doc), key=lambda e: e.path)
            if errs:
              for e in errs:
                print(f'  {path}: path={list(e.path)}: {e.message}')
              sys.exit(1)
            print(f'OK  {path}')
          "
      - name: Run CR-AM-05 views & aggregation conformance suite
        run: |
          python -m unittest -v assessment-models.tests.conformance.test_views_aggregation

  validate-cr-am-06-eligibility:
    name: CR-AM-06 benchmark model & eligibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate benchmark-cohort schema parses as Draft 2020-12
        run: |
          python -c "
          import json
          from jsonschema import Draft202012Validator
          for f in ['assessment-models/schemas/benchmark-cohort.schema.json',
                    'assessment-models/schemas/assessment-result.schema.json',
                    'assessment-models/schemas/common.schema.json']:
              with open(f) as fh:
                  Draft202012Validator.check_schema(json.load(fh))
              print(f'OK  {f}')
          "
      - name: Validate cohort + eligibility examples against schemas
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          yaml.SafeLoader.add_constructor(
              'tag:yaml.org,2002:timestamp',
              lambda loader, node: loader.construct_scalar(node),
          )

          with open('assessment-models/schemas/common.schema.json') as fh: common = json.load(fh)
          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          cases = [
              ('assessment-models/benchmark/cohort-examples/telecom-service-assurance-2026.yaml',
               'assessment-models/schemas/benchmark-cohort.schema.json'),
              ('assessment-models/benchmark/eligibility-examples/eligible-result.yaml',
               'assessment-models/schemas/assessment-result.schema.json'),
              ('assessment-models/benchmark/eligibility-examples/not-comparable-result.yaml',
               'assessment-models/schemas/assessment-result.schema.json'),
          ]
          errors = 0
          for path, schema_path in cases:
              with open(schema_path) as fh: s = json.load(fh)
              resolver = RefResolver(base_uri='', referrer=s, store=store)
              v = Draft202012Validator(s, resolver=resolver)
              doc = yaml.safe_load(open(path))
              errs = list(v.iter_errors(doc))
              if errs:
                  errors += 1
                  for e in errs[:5]:
                      print(f'FAIL {path}: path={list(e.path)}: {e.message}')
              else:
                  print(f'OK  {path}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(cases)} benchmark examples validate against their schemas')
          "
      - name: Run CR-AM-06 benchmark eligibility conformance suite
        run: |
          python -m unittest -v assessment-models.tests.conformance.test_benchmark_eligibility

  validate-cr-am-05a-instruments:
    name: CR-AM-05A hierarchical dimensions & instruments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema + pyyaml
        run: pip install jsonschema pyyaml
      - name: Validate new schemas parse as Draft 2020-12
        run: |
          python -c "
          import json
          from jsonschema import Draft202012Validator
          for f in ['assessment-models/schemas/dimension.schema.json',
                    'assessment-models/schemas/criterion.schema.json',
                    'assessment-models/schemas/indicator.schema.json',
                    'assessment-models/schemas/question.schema.json',
                    'assessment-models/schemas/response-specification.schema.json',
                    'assessment-models/schemas/assessment-item.schema.json',
                    'assessment-models/schemas/assessment-instrument.schema.json']:
              with open(f) as fh:
                  Draft202012Validator.check_schema(json.load(fh))
              print(f'OK  {f}')
          "
      - name: Validate hierarchical-maturity-assessment example
        run: |
          python -c "
          import json, yaml, sys
          from jsonschema import Draft202012Validator, RefResolver

          yaml.SafeLoader.add_constructor(
              'tag:yaml.org,2002:timestamp',
              lambda loader, node: loader.construct_scalar(node),
          )

          with open('assessment-models/schemas/common.schema.json') as fh: common = json.load(fh)
          store = {
              'https://github.com/technehub-labs/dea-metamodel/assessment-models/schemas/common.schema.json': common,
              'common.schema.json': common,
          }
          for extra in ['response-specification.schema.json', 'assessment-item.schema.json']:
              with open(f'assessment-models/schemas/{extra}') as fh: s = json.load(fh)
              store[extra] = s
              store[s['\$id']] = s

          with open('assessment-models/examples/hierarchical-maturity-assessment.yaml') as fh:
              doc = yaml.safe_load(fh)

          cases = []
          for d in doc['dimensions']:
              cases.append((d, 'dimension.schema.json'))
          for c in doc['criteria']:
              cases.append((c, 'criterion.schema.json'))
          for i in doc['indicators']:
              cases.append((i, 'indicator.schema.json'))
          for q in doc['questions']:
              cases.append((q, 'question.schema.json'))
          cases.append((doc['instrument'], 'assessment-instrument.schema.json'))

          errors = 0
          for entity, schema_file in cases:
              with open(f'assessment-models/schemas/{schema_file}') as fh: schema = json.load(fh)
              resolver = RefResolver(base_uri='', referrer=schema, store=store)
              v = Draft202012Validator(schema, resolver=resolver)
              errs = list(v.iter_errors(entity))
              if errs:
                  errors += 1
                  for e in errs[:3]:
                      print(f'FAIL {entity.get(\"id\")} vs {schema_file}: {e.message}')
          if errors:
              sys.exit(1)
          print(f'OK — {len(cases)} entities validate (3 dimensions, 2 criteria, 2 indicators, 6 questions, 1 instrument)')
          "
      - name: Run CR-AM-05A hierarchical instruments conformance suite
        run: |
          python -m unittest -v assessment-models.tests.conformance.test_hierarchical_instruments
