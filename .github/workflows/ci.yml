# DEA Metamodel — GitHub Actions CI

name: Metamodel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade jsonschema rdflib pyyaml

      - name: Validate metamodel.yaml
        run: python3 .github/scripts/validate_metamodel_yaml.py

      - name: Validate all JSON schemas
        run: python3 .github/scripts/validate_json_schemas.py

      - name: Parse all Turtle files
        run: python3 .github/scripts/validate_ttl.py

      - name: Apply SQLite schema (dry-run)
        run: |
          sqlite3 :memory: < sqlite/schema.sql
          echo "SQLite schema applied successfully"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type check TypeScript interfaces
        run: |
          cd typescript
          npm install --silent
          npx tsc --noEmit
        continue-on-error: true
