# DEA Metamodel — GitHub Actions CI

name: Metamodel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade jsonschema rdflib pyyaml pytest

      - name: Run conformance suite (CR-1.9 tests 001-006 + CR-1.11 drift enforcement)
        run: python3 -m pytest tests/conformance/ -v

      - name: Run runtime suite (CR-9 graph/provenance + CR-10 scenario + CR-11 interop)
        run: python3 -m pytest tests/runtime/ -v

      - name: Validate metamodel.yaml
        run: python3 .github/scripts/validate_metamodel_yaml.py

      - name: Validate all JSON schemas
        run: python3 .github/scripts/validate_json_schemas.py

      - name: Clone dea-metaframework (read-only; canonical ECF schemas for CR-MM-ECF-01 validator)
        # Closes matrix finding F1 for `dea-metamodel`. The canonical
        # PascalCase enum lives in dea-metaframework/schemas/; this clone
        # is read-only and matched against the existing ecf-conformance.yml
        # workflow pattern.
        run: |
          git clone --depth 1 https://github.com/technehub-labs/dea-metaframework.git /tmp/dea-metaframework || echo "skip: metaframework clone not permitted in this runner"

      - name: Validate ECF kebab-case restatement (CR-MM-ECF-01)
        # Closes matrix finding F1 for `dea-metamodel`. Proves every kebab-case
        # value in the ecf_domain / ecf_stage enums of business-object.json and
        # organizational-unit.json resolves 1:1 to the canonical PascalCase
        # enum in `dea-metaframework`. Stdlib only; runs the validator's
        # built-in self-test as well.
        env:
          ECF_FRAMEWORK_ROOT: /tmp/dea-metaframework
        run: python3 scripts/validate_ecf_kebab_restatement.py

      - name: Parse all Turtle files
        run: python3 .github/scripts/validate_ttl.py

      - name: Validate entity graph against its schema
        run: |
          python3 -c "
          import json, jsonschema
          g = json.load(open('viewer/entity-graph.json'))
          s = json.load(open('viewer/entity-graph.schema.json'))
          jsonschema.Draft7Validator.check_schema(s)
          errs = list(jsonschema.Draft7Validator(s).iter_errors(g))
          for e in errs: print('  ✗', list(e.absolute_path), e.message)
          raise SystemExit(1 if errs else 0)
          "

      - name: Verify pydantic models are current + compile
        run: |
          pip install pydantic
          python3 .github/scripts/generate_pydantic.py
          git diff --exit-code -- pydantic/ || { echo "pydantic/ is stale — regenerate with .github/scripts/generate_pydantic.py"; exit 1; }
          cd pydantic
          python3 -c "
          import sys, glob, py_compile
          sys.path.insert(0, '.')
          for f in glob.glob('*.py'): py_compile.compile(f, doraise=True)
          import metric, ecosystem_actor, value_exchange, collaboration_agreement, business_function, business_capability
          print('pydantic scaffold compiles and imports cleanly')
          "

      - name: Apply SQLite schema (dry-run)
        run: |
          sqlite3 :memory: < sqlite/schema.sql
          echo "SQLite schema applied successfully"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type check TypeScript interfaces
        run: |
          cd typescript
          npm install --silent
          npx tsc --noEmit
        # No continue-on-error: type failures must block CI.
        # Previously silenced via continue-on-error: true; removed so future
        # type regressions surface immediately.
