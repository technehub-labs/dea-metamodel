name: Render Metamodel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'metamodel-puml/**'
      - 'viewer/**'
      - '.github/workflows/render-metamodel.yml'
      - '.github/scripts/generate_puml.py'
      - '.github/scripts/inject_svg_attributes.py'
      - '.github/scripts/validate_svg_graph.py'
  push:
    branches: [main]
    paths:
      - 'metamodel-puml/**'
      - 'viewer/**'
      - '.github/workflows/render-metamodel.yml'
      - '.github/scripts/generate_puml.py'
      - '.github/scripts/inject_svg_attributes.py'
      - '.github/scripts/validate_svg_graph.py'

permissions:
  contents: write

jobs:
  # Single combined job: render + validate + commit. Same workspace
  # so the freshly-rendered SVG is visible to the git diff check.
  render:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlantUML 1.2024.7 + Graphviz
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz
          # Ubuntu 24.04 apt ships PlantUML 1.2020.02, which emits an older
          # SVG format without id="elem_<alias>" markers on entity <g>
          # blocks. Download a recent PlantUML JAR directly to ensure the
          # SVG output matches the structure the validator expects.
          sudo apt-get install -y plantuml  # keep for dot/graphviz deps
          curl -sSL -o /tmp/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar"
          ls -la /tmp/plantuml.jar
          # Use a wrapper so 'plantuml' command uses the newer JAR
          sudo mv /usr/bin/plantuml /usr/bin/plantuml.distrib
          sudo tee /usr/bin/plantuml > /dev/null << 'WRAPPER'
          #!/bin/sh
          exec java -jar /tmp/plantuml.jar "$@"
          WRAPPER
          sudo chmod +x /usr/bin/plantuml
          plantuml -version || java -jar /tmp/plantuml.jar -version
          dot -V

      - name: Validate entity-graph.json
        run: |
          python3 -m pip install --quiet jsonschema
          python3 -c "
          import json
          from jsonschema import validate, ValidationError
          with open('viewer/entity-graph.schema.json') as f: schema = json.load(f)
          with open('viewer/entity-graph.json') as f: graph = json.load(f)
          try:
              validate(instance=graph, schema=schema)
              print(f'OK — {len(graph[\"entities\"])} entities validated')
              for e in graph['entities']:
                  print(f'  {e[\"layer\"]}  {e[\"class_alias\"]:4s}  {e[\"display_name\"]:30s} -> {e[\"catalog_repo\"]}')
          except ValidationError as ex:
              print(f'VALIDATION FAILED: {ex.message}')
              exit(1)
          "

      - name: Generate canonical PUML from entity-graph
        run: |
          python3 .github/scripts/generate_puml.py > metamodel-puml/metamodel-v2.puml
          echo "Generated PUML with $(grep -c 'entity \"' metamodel-puml/metamodel-v2.puml) entity declarations"

      - name: Render PUML to SVG
        run: |

          # PlantUML 1.2024.x writes SVG output to CWD (not alongside input).
          # cd into input dir so output lands at the expected location.
          cd metamodel-puml
          plantuml -tsvg metamodel-v2.puml
          cd ..
          if [ ! -f metamodel-puml/metamodel-v2.svg ]; then
            echo "ERROR: PlantUML did not produce metamodel-puml/metamodel-v2.svg"
            ls -la metamodel-puml/
            exit 1
          fi
          mkdir -p viewer
          cp metamodel-puml/metamodel-v2.svg viewer/metamodel.svg
          ls -la viewer/metamodel.svg

          echo "elem_ id count: $(grep -c 'id="elem_' viewer/metamodel.svg || echo 0)"

      - name: Render PUML to PNG (build artifact)
        run: |
          cd metamodel-puml
          plantuml -tpng metamodel-v2.puml
          cd ..

      - name: Inject SVG attributes for interactivity
        run: |
          # PlantUML 1.2024.x emits <g id="elem_<ALIAS>"> for entities
          # but doesn't add class="entity" or data-alias attributes.
          # The Pages site's viewer.js selects `g.entity[data-alias]`
          # to wire click + hover handlers; inject these to restore
          # interactivity parity with the previous version.
          python3 .github/scripts/inject_svg_attributes.py viewer/metamodel.svg

      - name: Cross-format validator (SVG vs entity-graph)
        run: |
          python3 .github/scripts/validate_svg_graph.py

      - name: Configure git
        run: |
          git config user.name "dea-metamodel-bot"
          git config user.email "dea-metamodel-bot@users.noreply.github.com"

      - name: Check if SVG changed
        id: check
        run: |
          if git diff --quiet viewer/metamodel.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SVG is identical to committed version — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SVG differs from committed version — will commit."
          fi

      - name: Commit + push updated SVG
        if: steps.check.outputs.changed == 'true'
        run: |
          git add viewer/metamodel.svg metamodel-puml/metamodel-v2.puml
          git commit -m "ci(viewer): regenerate metamodel.svg from canonical entity-graph

          Auto-generated by .github/workflows/render-metamodel.yml after
          entity-graph.json changes. No review required — the SVG is
          mechanically derived from the canonical registry."
          git push
          echo "Pushed updated SVG."

      - name: Skip summary
        if: steps.check.outputs.changed != 'true'
        run: echo "No-op run — SVG matches committed version."

      - name: Upload rendered diagram artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-v2-diagram
          path: |
            viewer/metamodel.svg
            metamodel-puml/metamodel-v2.png
            metamodel-puml/metamodel-v2.svg
          if-no-files-found: warn

  # PR-only validation: render + validate but do NOT commit.
  # This runs on pull_request events; the merge to main then triggers
  # the commit-enabled render job above.
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlantUML 1.2024.7 + Graphviz
        run: |
          sudo apt-get update -y
          sudo apt-get install -y graphviz plantuml
          curl -sSL -o /tmp/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar"
          sudo mv /usr/bin/plantuml /usr/bin/plantuml.distrib
          sudo tee /usr/bin/plantuml > /dev/null << 'WRAPPER'
          #!/bin/sh
          exec java -jar /tmp/plantuml.jar "$@"
          WRAPPER
          sudo chmod +x /usr/bin/plantuml
          plantuml -version || java -jar /tmp/plantuml.jar -version
          dot -V
      - name: Generate canonical PUML from entity-graph
        run: |
          python3 .github/scripts/generate_puml.py > metamodel-puml/metamodel-v2.puml
      - name: Render PUML to SVG (no commit)
        run: |
          cd metamodel-puml
          plantuml -tsvg metamodel-v2.puml
          cd ..
          # Mirror the render job: the cross-format validator reads
          # viewer/metamodel.svg, so the fresh render must be copied there.
          cp metamodel-puml/metamodel-v2.svg viewer/metamodel.svg
      - name: Inject SVG attributes for interactivity
        run: |
          python3 .github/scripts/inject_svg_attributes.py viewer/metamodel.svg
      - name: Cross-format validator
        run: |
          python3 .github/scripts/validate_svg_graph.py
      - name: Upload rendered diagram artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-v2-diagram-pr
          path: |
            metamodel-puml/metamodel-v2.png
            metamodel-puml/metamodel-v2.svg
          if-no-files-found: warn
