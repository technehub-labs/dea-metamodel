# Example — BenchmarkComparison (CR-AM-07 Phase 1)
# A reproducible derivation over the admitted members of the
# telecom-service-assurance-2026 BenchmarkCohort (CR-AM-06 §6 worked
# cohort). This is the CR-AM-06 §10 worked shape made canonical:
#   Company A -> Score = 82 -> Percentile -> Peer position 4/27.
#
# Note on the percentile value: CR-AM-06 §10 illustrated "87" as an
# example of the SHAPE of the output. The exact value is determined by
# the declared percentile_method; under `inclusive` with n=27 and 23
# members strictly below 82, percentile = 23/26 x 100 = 88.5. The Phase 3
# engine recomputes this deterministically from the cohort snapshot.

