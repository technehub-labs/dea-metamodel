    id: dea:measure-architecture-standardization
    version: 1.0.0
    domain: technology
    unit: percent
    range:
    - 0
    - 100
    description: ratio of services with documented architecture to total services
  - kind: measure
    id: dea:measure-lifecycle-compliance
    version: 1.0.0
    domain: technology
    unit: percent
    range:
