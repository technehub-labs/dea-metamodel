catalogue:
  id: dea:catalogue-assessment-references
  name: OpenDEA Assessment Reference Catalogue
  version: 1.1.0
  status: stable
  description: Versioned Capability, Scenario, Measure, Evidence, ScoringModel, MaturityModel and
    ComponentRegistry references for the OpenDEA assessment federation. The catalogue is the
    resolution authority for canonical references; it does not redefine assessment scoring or
    maturity semantics. Version 1.1.0 extends coverage to every published maturity model (the
    cardinal root) and to the component registry. Relatability between models is declared in
    model-relations.yaml, not here — this catalogue resolves identity and version only.
  references:
  - kind: capability
    id: dea:capability-technology-architecture
    version: 1.0.0
    domain: technology
  - kind: capability
    id: dea:capability-technology-lifecycle
    version: 1.0.0
    domain: technology
  - kind: capability
    id: dea:capability-skills-and-coverage
    version: 1.0.0
    domain: technology
  - kind: capability
    id: dea:capability-technical-debt-management
    version: 1.0.0
    domain: technology
  - kind: scenario
    id: dea:scenario-enterprise-technology-health
    version: 1.0.0
    domain: technology
  - kind: measure
    id: dea:measure-architecture-standardization
    version: 1.0.0
    domain: technology
    unit: percent
    range:
    - 0
    - 100
    description: ratio of services with documented architecture to total services
  - kind: measure
    id: dea:measure-lifecycle-compliance
    version: 1.0.0
    domain: technology
    unit: percent
    range:
    - 0
    - 100
    description: ratio of components with current lifecycle to total components
  - kind: measure
    id: dea:measure-skill-coverage
    version: 1.0.0
    domain: technology
    unit: percent
    range:
    - 0
    - 100
    description: ratio of critical skills with redundant coverage to total critical skills
  - kind: measure
    id: dea:measure-technical-debt-trend
    version: 1.0.0
    domain: technology
    unit: count
    range:
    - -50
    - 50
    description: rolling 90-day trend in technical debt backlog size (count)
