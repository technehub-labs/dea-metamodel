# Example — Canonical Technology Assessment
# Source: CR-AM-01 supplement §8
# Purpose: Demonstrates the canonical form after migration. The assessment
# no longer OWNS the capability or maturity definition — it references them.

id: dea:assessment-technology
name: Technology Assessment
type: assessment-model
version: "2.0.0"
metamodel_version: "1.0.0"

purpose:
  - enterprise-health
  - capability-assessment
  - diagnostic

subject_type: enterprise
status: stable

capabilities:
  - id: dea:capability-technology-architecture
    version: "1.0.0"
  - id: dea:capability-technology-platform
    version: "1.0.0"
  - id: dea:capability-technology-lifecycle
    version: "1.0.0"

dimensions:
  - id: architecture
    name: Architecture
    weight: 0.25
  - id: platform
    name: Platform
    weight: 0.25
  - id: lifecycle
    name: Technology Lifecycle
    weight: 0.25
  - id: technical-debt
    name: Technical Debt
    weight: 0.25

measures:
  - id: dea:measure-architecture-standardization
    version: "1.0.0"
  - id: dea:measure-platform-reuse
    version: "1.0.0"

scoring_model:
  id: dea:scoring-four-point
  version: "1.0.0"

maturity_models:
  - id: dea:maturity-technology
    version: "1.0.0"

# Explicit compatibility declaration (CR-AM-01 §25)
# CR-AM-02 §11: six-axis compatibility declaration against the
# previous model version. Schema+semantic compatible (the same fields
# are present); scoring compatible (same scale 0-3); maturity compatible
# (same level set); result compatible (result structure unchanged by
# this version); benchmark INCOMPATIBLE (the benchmark population now
# requires explicit eligibility — declared per result).
compatibility:
  schema: compatible
  semantic: compatible
  scoring: compatible
  maturity: compatible
  result: compatible
  benchmark: incompatible