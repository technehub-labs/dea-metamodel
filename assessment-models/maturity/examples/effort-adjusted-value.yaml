# Worked Example — Effort-Adjusted Value at Score 80 (Adaptive)
#
# Demonstrates the second-axis metric introduced by CR-014's maturity v2 scoring.
# Raw score 80 lands at Adaptive (71–88). The diminishing-returns curve is
# made visible by summing points-earned-per-band / effort-multiplier-per-band.

example:
  id: effort-adjusted-value-score-80
  description: >
    An organisation has scored 80/100 on the maturity assessment. That raw
    score places them in the Adaptive band (71–88). This example computes the
    effort-adjusted value — the same organisation's value, expressed in units
    that account for the superlinear effort at higher bands.

  inputs:
    raw_score: 80
    bands:
      - { name: Emergent,           range: [0, 20],   effort_multiplier: 1.0 }
      - { name: Structured,         range: [21, 45],  effort_multiplier: 1.5 }
      - { name: Systematic,         range: [46, 70],  effort_multiplier: 2.5 }
      - { name: Adaptive,           range: [71, 88],  effort_multiplier: 4.0 }
      - { name: Self-Optimising,    range: [89, 100], effort_multiplier: 6.0 }

  computation:
    formula: >
      value_realised(score) = Σ (points_earned_in(b) / effort_multiplier(b))

      where points_earned_in(b) for band b with range [lo, hi] and width w is:
        - 0                       if score < lo
        - width (full band)       if score ≥ hi
        - score - lo + 1          otherwise (mid-band, inclusive of lo)

      For score 80:
        - Emergent           [0,20],  width 20: score 80 ≥ 20   → full band → 20 / 1.0 = 20.0000
        - Structured        [21,45],  width 25: score 80 ≥ 45   → full band → 25 / 1.5 = 16.6667
        - Systematic        [46,70],  width 25: score 80 ≥ 70   → full band → 25 / 2.5 = 10.0000
        - Adaptive          [71,88],  width 18: score 80 < 88   → partial    → (80-71+1)=10 / 4.0 = 2.5000
        - Self-Optimising [89,100],  width 12: score 80 < 89   → no reach  → 0    / 6.0 = 0.0000
        Total: 49.1667, rounded to 49.2.

    points_earned_in_each_band:
      Emergent:           20    # full band 0–20 (score ≥ upper bound)
      Structured:         25    # full band 21–45 (score ≥ upper bound)
      Systematic:         25    # full band 46–70 (score ≥ upper bound)
      Adaptive:           10    # partial: 71..80 inclusive
      Self-Optimising:    0     # not reached

    effort_adjusted_value_per_band:
      Emergent:           { points: 20, multiplier: 1.0, value: 20.0 }
      Structured:         { points: 25, multiplier: 1.5, value: 16.6667 }
      Systematic:         { points: 25, multiplier: 2.5, value: 10.0 }
      Adaptive:           { points: 10, multiplier: 4.0, value: 2.5 }
      Self-Optimising:    { points: 0,  multiplier: 6.0, value: 0.0 }

  result:
    raw_score: 80
    raw_score_band: Adaptive
    effort_adjusted_value: 49.2     # sum rounded to 1 decimal: 20 + 16.7 + 10 + 2.5 = 49.2
    total_effort_adjusted_value: 49.2

  interpretation:
    raw_score_meaning: >
      The organisation is at the 80/100 point — Adaptive band, 10 points into it.
    effort_adjusted_meaning: >
      The 80 raw points translate to 49.2 effort-adjusted value units.
      The diminishing-returns curve is visible: the first 20 points delivered
      20 value units (at 1.0×); the last 10 points delivered 2.5 (at 4.0×).
    marginal_point_at_adaptive: 0.25    # 1 / 4.0 — each next Adaptive point adds 0.25 value units
    marginal_point_at_systematic: 0.4  # 1 / 2.5 — each Systematic point adds 0.4 value units
    cross_domain_signal: >
      Raising another organisation from 68 → 70 (Systematic, +2 points at 0.4/each = +0.8 value units)
      costs less effort-adjusted value than raising this organisation from 80 → 82
      (Adaptive, +2 points at 0.25/each = +0.5 value units). This is the portfolio-
      allocation signal the v1 model cannot produce.

  # Round-trip check: a programmatic implementation must reproduce this value to ±0.1.
  acceptance_tolerance: 0.1