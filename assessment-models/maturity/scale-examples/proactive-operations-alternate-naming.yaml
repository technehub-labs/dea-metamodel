# Maturity Scale — alternate-naming (Not Present / Reactive / Managed /
# Proactive / Optimized)
# Worked example 3 — proves the metamodel does not impose a canonical
# L0=L1=Absent/Initial/… terminology. Same five-level shape as worked
# example 1; entirely different level names. A benchmark comparison must
# not treat this model's L3 as equivalent to the autonomous-operations
# model's L-3 — the (MaturityModel, MaturityScale, MaturityLevel)
# identity rule (CR-AM-09 §9).

id: dea:scale-proactive-operations-v1
version: "1.0.0"
metamodel_version: "1.0.0"
name: Proactive Operations Maturity Scale (5-level, alternate naming)
description: >
  Same five-level shape as the autonomous-operations example, with
  entirely different level names. Demonstrates that the metamodel
  enforces no global five-level terminology — L0 means 'Not Present'
  here, 'Absent' in the autonomous-operations model, and either name
  is valid. Benchmarks MUST compare via (model, scale, level)
  identity, never via the level id or name alone.
status: stable

levels:
  - id: L0
    ordinal: 0
    name: Not Present
    definition: >
      The capability or practice is not present in the assessed scope.
  - id: L1
    ordinal: 1
    name: Reactive
    definition: >
      Practice responds to events after they occur; there is no
      forward-looking detection or control.
  - id: L2
    ordinal: 2
    name: Managed
    definition: >
      Practice is repeatable and governed; performance is observable
      and within declared tolerances.
  - id: L3
    ordinal: 3
    name: Proactive
    definition: >
      Practice anticipates and prevents the events before they happen;
      forward-looking detection and control are routine.
  - id: L4
    ordinal: 4
    name: Optimized
    definition: >
      Practice continuously improves itself based on operational
      evidence; improvement is systemic, not ad-hoc.

ordering: ascending

progression:
  topology: linear
  function: exponential

conformance:
  statuses:
    - conformant
    - partially-conformant
    - non-conformant
    - indeterminate
    - not-assessable
  highest_conformant_level_resolution: true