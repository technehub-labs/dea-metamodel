id: dea:assessment-modernization
name: Architecture Modernization Assessment
type: assessment-model
version: 1.0.0
metamodel_version: 1.0.0
status: stable
description: 'Assess an organisation''s approach to architecture modernisation — legacy migration, strangler-fig adoption, decomposition strategy, execution discipline, and people readiness.

  '
purpose:
- capability-assessment
subject_type: enterprise
classification:
  domain: modernization
capabilities:
- id: dea:capability-modernization-strategy
  version: 1.0.0
- id: dea:capability-migration-pattern-library
  version: 1.0.0
- id: dea:capability-wave-planning-and-execution
  version: 1.0.0
- id: dea:capability-modernization-metrics
  version: 1.0.0
- id: dea:capability-modernization-culture
  version: 1.0.0
scenarios:
