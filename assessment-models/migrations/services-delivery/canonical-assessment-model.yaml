id: dea:assessment-services-delivery
name: Services Delivery Assessment
type: assessment-model
version: 1.0.0
metamodel_version: 1.0.0
status: stable
description: 'Assess services delivery capability — delivery predictability, flow efficiency, quality and defect management, customer outcomes, and team health.

  '
purpose:
- capability-assessment
subject_type: enterprise
classification:
  domain: services-delivery
capabilities:
- id: dea:capability-delivery-predictability
  version: 1.0.0
- id: dea:capability-flow-efficiency
  version: 1.0.0
- id: dea:capability-quality-management
  version: 1.0.0
- id: dea:capability-customer-outcomes
  version: 1.0.0
- id: dea:capability-team-health
  version: 1.0.0
scenarios:
- &id001
  id: dea:scenario-customer-facing-delivery-programme
  version: 1.0.0
dimensions:
- id: predictability
  name: Delivery Predictability
  weight: 0.25
  questions:
  - id: predictability-q1
    text: Are release dates forecast with more than 80% accuracy?
  - id: predictability-q2
    text: Are scope, time, quality trade-offs explicitly managed?
  - id: predictability-q3
    text: Is there a clear definition of done used across all teams?
  - id: predictability-q4
    text: Are delivery commitments tracked at portfolio and team level?
- id: flow
  name: Flow Metrics & Efficiency
  weight: 0.2
  questions:
  - id: flow-q1
    text: Are lead time and cycle time tracked per team?
  - id: flow-q2
    text: Is WIP (work-in-progress) actively limited?
  - id: flow-q3
    text: Are blockers identified and resolved within 24 hours?
  - id: flow-q4
    text: Is there investment in flow improvement (tools, training, automation)?
- id: quality
  name: Quality & Defect Management
  weight: 0.2
  questions:
  - id: quality-q1
    text: Is escaped defect rate tracked and trending downward?
  - id: quality-q2
    text: Are quality gates enforced in CI (test coverage, static analysis)?
  - id: quality-q3
    text: Is quality measured by customer impact, not just bug count?
  - id: quality-q4
    text: Are production incidents correlated with release changes?
- id: outcomes
  name: Customer Outcomes & Value
  weight: 0.2
  questions:
  - id: outcomes-q1
    text: Are customer outcomes linked to releases (outcome-based roadmaps)?
  - id: outcomes-q2
    text: Is there an experimentation capability (A/B testing, feature flags)?
  - id: outcomes-q3
    text: Is delivery ROI measured per initiative?
  - id: outcomes-q4
    text: Is customer satisfaction (NPS/CSAT) tracked and acted upon?
- id: team
  name: Team Health & Practices
  weight: 0.15
  questions:
  - id: team-q1
    text: Are retrospectives held regularly and produce tracked actions?
  - id: team-q2
    text: Is team satisfaction measured (e.g., annual survey, pulse checks)?
  - id: team-q3
    text: Is there a healthy balance of feature work, tech debt, and learning?
measures:
- id: dea:measure-release-forecast-accuracy
  version: 1.0.0
- id: dea:measure-lead-time-p50
  version: 1.0.0
- id: dea:measure-escaped-defect-rate
  version: 1.0.0
- id: dea:measure-outcome-to-release-linkage
  version: 1.0.0
- id: dea:measure-team-health-index
  version: 1.0.0
scoring_model:
  id: dea:scoring-four-point
  version: 1.0.0
maturity_models:
- id: dea:maturity-services-delivery
  version: 1.0.0
evidence_requirements:
- id: dea:evidence-services-delivery-core
  version: 1.0.0
