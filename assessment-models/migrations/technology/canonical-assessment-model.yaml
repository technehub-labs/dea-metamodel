  legacy_dimensions:
  - id: stack-fitness
    name: Stack Fitness & Standardisation
    weight: 0.3
    questions:
    - id: q1
      text: Is there a published, approved technology list (ATL)?
      evidence:
      - ATL published
      - PR template references ATL
      - ATL reviewed quarterly
    - id: q2
      text: Is technology usage measured against the ATL (adherence rate)?
      evidence:
      - adherence dashboard
      - deviations flagged
      - drift tracked
    - id: q3
      text: Are new technology adoption requests reviewed through a formal process?
      evidence:
      - process documented
      - decision authority clear
      - request template in use
    - id: q4
      text: Are shadow IT instances identified and remediated?
      evidence:
      - discovery process
      - remediation playbook
      - tracked in register
  - id: technical-debt
    name: Technical Debt Management
    weight: 0.25
    questions:
    - id: q1
      text: Is technical debt quantified (effort, cost, or risk)?
      evidence:
      - quantification model
      - debt register
      - risk-weighted scoring
    - id: q2
      text: Is there a technical debt remediation roadmap?
      evidence:
      - roadmap published
      - owners assigned
      - budget line
    - id: q3
      text: Is technical debt tracked as a top-N risk register item?
      evidence:
      - in risk register
      - reviewed monthly
      - escalation path defined
    - id: q4
      text: Are 'don't repeat yourself' violations (DRY/dead code) actively reduced?
      evidence:
      - DRY metric tracked
      - dead code removed quarterly
      - lint rules enforced
  - id: lifecycle
    name: Lifecycle & End-of-Life Management
    weight: 0.2
    questions:
    - id: q1
      text: Is software lifecycle (e.g., LTS) tracked across all production systems?
      evidence:
      - lifecycle inventory
      - EOL alerts configured
      - renewal calendar
    - id: q2
      text: Is there zero end-of-life software in production?
      evidence:
      - EOL check automated
      - zero EOL confirmed
      - exceptions documented
    - id: q3
      text: Are dependency upgrades part of the regular development cycle?
      evidence:
      - Dependabot/Renovate active
      - upgrade PRs merged regularly
      - upgrade SLA defined
    - id: q4
      text: Is SBOM generated for every production release?
      evidence:
      - SBOM in CI
      - SBOM in release artefacts
      - SBOM archived
  - id: skill-coverage
    name: Skill Coverage & Knowledge Risk
    weight: 0.15
    questions:
    - id: q1
      text: Is there a skill matrix for critical technologies?
      evidence:
      - matrix published
      - refreshed quarterly
      - covers all critical tech
    - id: q2
      text: Are single points of failure (SPoF) per critical technology identified?
      evidence:
      - SPoF register
      - backup owners assigned
      - redundancy plan
    - id: q3
      text: Is knowledge sharing active (lunch-and-learns, internal docs, pair rotation)?
      evidence:
      - monthly sessions
      - internal docs maintained
      - pair rotation scheduled
  - id: tooling-integration
    name: Tooling Integration & Observability
    weight: 0.1
    questions:
    - id: q1
      text: Is technology observability tooling integrated with incident response?
      evidence:
      - integrated stack
      - incident playbook references
      - runbooks linked
    - id: q2
      text: Is cost-per-workload tracked for production systems?
      evidence:
      - cost tagging
      - dashboard published
      - cost owner assigned
    - id: q3
      text: Are technology decisions evaluated against ROI before adoption?
      evidence:
      - ROI template
      - evaluation criteria documented
      - post-adoption review
  capability_names:
  - name: Technology Architecture
