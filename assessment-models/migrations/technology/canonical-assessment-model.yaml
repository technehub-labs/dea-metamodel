  - name: Technology Lifecycle
    domain: Technology
  - name: Skills and Coverage
    domain: Technology
  - name: Technical Debt Management
    domain: Technology
  scenario_names:
  - name: Enterprise Technology Health
    version: 1.0.0
  measure_specs:
  - name: Architecture Standardization
    description: ratio of services with documented architecture to total services
    unit: percent
    range:
    - 0
    - 100
  - name: Lifecycle Compliance
    description: ratio of components with current lifecycle to total components
    unit: percent
    range:
    - 0
    - 100
  - name: Skill Coverage
    description: ratio of critical skills with redundant coverage to total critical skills
    unit: percent
    range:
    - 0
    - 100
  - name: Technical Debt Trend
    description: rolling 90-day trend in technical debt backlog size (count)
    unit: count
    range:
    - -50
    - 50
