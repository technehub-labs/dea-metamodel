---
# Source: CR-AM-02 §17 — Technology Assessment Pilot Migration.
# Generated by the migration layer from:
#   examples/legacy-technology-instrument.yaml (v1 instrument)
#   mapped via ../v1-instrument/mapping.yaml
#
# This file is the canonical projection of the legacy Technology Assessment.
# Existing semantics are preserved (CR-AM-02 §22 AC-07): the same 5 dimensions,
# the same 19 questions, the same four-point scoring scale, the same maturity
# target. Nothing in the legacy declaration is lost.

# ─── Provenance ────────────────────────────────────────────────
# `migration` is intentionally a free-form sidecar; it carries the
# provenance + migration notes that the canonical assessment-model schema
# (assessment-model.schema.json) does NOT carry (additionalProperties: false).
# The canonical projection is the body below; the migration sidecar lives
# in a sibling file at migrations/v1-instrument/canonical-technology-migration.yaml
# — see the corresponding migration-manifest.yaml for the cross-reference.

# ─── Canonical form (the deliverable) ──────────────────────────
id: dea:assessment-technology
name: Technology Assessment
type: assessment-model
version: "1.0.0"
metamodel_version: "1.0.0"
status: stable
description: >
  Legacy v1 technology assessment instrument with five weighted dimensions
  and 19 questions. The migration layer projects this into the canonical
  AssessmentModel v1 with semantically equivalent canonical structure.

# CR-AM-02 §11: six-axis compatibility declaration (CR-AM-02 §11).
# The legacy scoring used a 4-point scale without explicit benchmark
# eligibility → migrated model is benchmark-incompatible.
compatibility:
  schema: compatible
  semantic: compatible
  scoring: compatible
  maturity: compatible
  result: compatible
  benchmark: incompatible

# ─── Canonical references (CR-AM-01 §10) ───────────────────────
maturity_models:
  - id: dea:maturity-technology
    version: "1.0.0"

# CR-AM-02 §7.9: scoring is on the model level (ScoringModel reference).
# The legacy four-point scale [0,1,2,3] is the canonical scoring-four-point.
scoring_model:
  id: dea:scoring-four-point
  version: "1.0.0"

# CR-AM-02 §49: every AssessmentModel declares at least one purpose.
# Legacy did not declare purpose; migration surfaces capability-assessment.
purpose:
  - capability-assessment

subject_type: enterprise

# ─── Dimensions (5 total, matching the legacy) ──────────────────
# Each dimension carries its weight (preserved verbatim from the legacy's
# dimension-level weight) and the questions (preserved verbatim by text).
# Per-question scoring is moved to the model-level scoring_model reference.
# Per-question evidence strings are surfaced as evidence_requirements refs.
dimensions:
  - id: architecture
    name: Architecture
    weight: 0.25
    questions:
      - id: architecture-q01
        text: "Is the technology stack documented in a shared catalog?"
      - id: architecture-q02
        text: "Is there a published architecture review cadence?"
      - id: architecture-q03
        text: "Are architecture decisions recorded as ADRs?"
      - id: architecture-q04
        text: "Is the architecture layered (edge / platform / data / etc.)?"
      - id: architecture-q05
        text: "Is the architecture diagram under version control?"

  - id: technology-choice
    name: Technology Choice
    weight: 0.20
    questions:
      - id: technology-choice-q01
        text: "Is there an approved technology list?"
      - id: technology-choice-q02
        text: "Is the technology list reviewed periodically?"
      - id: technology-choice-q03
        text: "Is there a deprecation policy for end-of-life technology?"
      - id: technology-choice-q04
        text: "Is there a clear process for adopting new technology?"

  - id: technical-debt
    name: Technical Debt
    weight: 0.20
    questions:
      - id: technical-debt-q01
        text: "Is technical debt tracked?"
      - id: technical-debt-q02
        text: "Is there a remediation roadmap?"
      - id: technical-debt-q03
        text: "Is technical debt prioritised against other work?"

  - id: skills
    name: Skills
    weight: 0.20
    questions:
      - id: skills-q01
        text: "Is skill coverage mapped?"
      - id: skills-q02
        text: "Are single points of failure identified?"
      - id: skills-q03
        text: "Is there a succession plan for critical roles?"

  - id: lifecycle
    name: Lifecycle
    weight: 0.15
    questions:
      - id: lifecycle-q01
        text: "Is end-of-life software tracked?"
      - id: lifecycle-q02
        text: "Is there a refresh budget?"
      - id: lifecycle-q03
        text: "Is end-of-life software actively retired?"
