# Relationship Type Vocabulary
# Controlled vocabulary for edges between model references.
# Source: CR-AM-01 §17, §41

vocabulary: relationship-type
version: "1.0.0"
metamodel_version: "1.0.0"
description: >
  The controlled set of relationship_type values permitted in any
  AssessmentMetamodel relationship edge. Replaces unrestricted relationship
  strings with a closed vocabulary. Definitions match CR-AM-01 §17.

values:
  - id: assesses
    description: AssessmentModel assesses Capability
    source_kinds: [assessment-model]
    target_kinds: [capability]

  - id: implements
    description: AssessmentInstrument implements AssessmentModel
    source_kinds: [assessment-instrument]
    target_kinds: [assessment-model]

  - id: conforms-to
    description: Assessment conforms to AssessmentModel
    source_kinds: [assessment, assessment-execution]
    target_kinds: [assessment-model]

  - id: uses
    description: AssessmentModel uses AssessmentMethod / ScoringModel
    source_kinds: [assessment-model]
    target_kinds: [scoring-model]

  - id: measures
    description: AssessmentModel / Observation measures Measure
    source_kinds: [assessment-model, observation]
    target_kinds: [measure]

  - id: requires
    description: AssessmentModel requires EvidenceRequirement
    source_kinds: [assessment-model]
    target_kinds: [evidence]

  - id: supports
    description: Generic support edge
    source_kinds: ["*"]
    target_kinds: ["*"]

  - id: evaluates
    description: Generic evaluation edge
    source_kinds: ["*"]
    target_kinds: [capability, scenario, measure]

  - id: occurs-in
    description: AssessmentExecution occurs in Scenario
    source_kinds: [assessment-execution]
    target_kinds: [scenario]

  - id: produces
    description: AssessmentExecution / ScoringRule / AssessmentModel produces result or output
    source_kinds: [assessment-execution, scoring-model, assessment-model]
    target_kinds: [assessment-result, score, benchmark-result]

  - id: contains
    description: AssessmentResult contains Observation / Finding / Score
    source_kinds: [assessment-result]
    target_kinds: [observation, finding, score]

  - id: interpreted-by
    description: AssessmentResult interpreted by MaturityModel (canonical). Replaces produces-score-for.
    source_kinds: [assessment-result]
    target_kinds: [maturity-model]

  - id: eligible-for
    description: AssessmentResult eligible for BenchmarkModel
    source_kinds: [assessment-result]
    target_kinds: [benchmark-model]

  - id: benchmarks
    description: BenchmarkModel benchmarks Capability / AssessmentResult
    source_kinds: [benchmark-model]
    target_kinds: [capability, assessment-result]

  - id: supersedes
    description: New model version supersedes previous version (lineage)
    source_kinds: ["*"]
    target_kinds: ["*"]

  - id: derived-from
    description: Model or artefact is derived from another
    source_kinds: ["*"]
    target_kinds: ["*"]

  - id: compatible-with
    description: Declared compatibility between two model versions
    source_kinds: ["*"]
    target_kinds: ["*"]

  # CR-MM-01.1 — registered 2026-08-21 to close the vocabulary gap surfaced by the
  # CR-MM-01 / CR-AM-01 compliance audit. Used by all 5 v2-beta maturity model YAMLs
  # in `assessment-models/maturity/v2-beta/` to link each v2 maturity model to the
  # canonical v2 bands registry.
  - id: scored-by-v2-bands
    description: |
      MaturityModel scored by the canonical v2 maturity scoring bands (non-linear
      20/25/25/18/12 with effort_multiplier 1.0/1.5/2.5/4.0/6.0). Distinct from
      `scored-by` (legacy alias for `interpreted-by`) so v1 and v2 scoring paths
      are first-class at the relationship-type layer.
    source_kinds: [maturity-model]
    target_kinds: [maturity-bands]

  # CR-MM-01.1 — registered 2026-08-21. The new `validate-relationship-vocabulary`
  # CI job surfaced these relationship types that have been used in the maturity
  # sub-tree since the v1 lineage but never formally registered.
  - id: instance-of
    description: |
      A model is an instance-of a catalog (e.g. a maturity model is one of the
      five canonical maturity models). Inherited from the v1 catalog lineage;
      registered retroactively to close the gap surfaced by the v2 vocabulary check.
    source_kinds: ["*"]
    target_kinds: [catalog, "*"]

  - id: measured-by
    description: |
      A model or artefact is measured by a referenced measurement framework or
      instrument. Inherited from the v1 catalog lineage; registered retroactively.
    source_kinds: ["*"]
    target_kinds: [assessment-instrument, framework, "*"]

  - id: references
    description: |
      A model references a related entity (e.g. a modernisation maturity model
      references the strangler-fig pattern, an operations maturity model references
      the circuit-breaker pattern). Inherited from the v1 catalog lineage.
    source_kinds: ["*"]
    target_kinds: [pattern, "*"]

  - id: supersedes-as-advisory
    description: |
      A registry artefact supersedes a previous one as advisory content (the
      previous version remains canonical until promotion). Used by
      `maturity-bands-v2.yaml` to declare v2 supersedes v1 advisory-bands while
      v1 stays canonical.
    source_kinds: [registry-artefact]
    target_kinds: [registry-artefact]

# Legacy aliases — accepted during transition only (CR-AM-01 §20):
legacy_aliases:
  produces-score-for: interpreted-by
  scored-by: interpreted-by