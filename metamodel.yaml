# DEA Metamodel — Entity & Relationship Index
# This file is the human-navigable index into the metamodel.
# For machine validation, use schemas/entities/<entity>.json and schemas/relationships/<rel>.json

metamodel:
  version: "0.2.0"
  opendeam_model: technehub-labs/dea-architecture-framework@v0.2.0
  schema_base: ./schemas/entities
  ttl_base: ./ttl
  sqlite_schema: ./sqlite/schema.sql
  typescript_src: ./typescript/src
  pydantic_src: ./pydantic

entities:
  - name: Entity
    abstract: true
    description: Abstract root type for all metamodel entities.
    schema: schemas/entities/entity.json
    ttl: ttl/entities/entity.ttl
    sqlite_table: entities
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/entity.py

  - name: Principle
    description: Architectural guiding principle (e.g., "API-first", "Data sovereignty").
    schema: schemas/entities/principle.json
    ttl: ttl/entities/principle.ttl
    sqlite_table: principles
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/principle.py

  - name: ArchitecturePattern
    description: Reusable architecture pattern (e.g., "API Gateway", "Event Sourcing", "CQRS").
    schema: schemas/entities/architecture-pattern.json
    ttl: ttl/entities/architecture-pattern.ttl
    sqlite_table: architecture_patterns
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/architecture_pattern.py

  - name: Standard
    description: Referenced industry standard or framework (TOGAF, Zachman, ISO, IEEE).
    schema: schemas/entities/standard.json
    ttl: ttl/entities/standard.ttl
    sqlite_table: standards
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/standard.py

  - name: ReferenceModel
    description: Reference architecture model (e.g., "Digital Platform", "Integration Hub").
    schema: schemas/entities/reference-model.json
    ttl: ttl/entities/reference-model.ttl
    sqlite_table: reference_models
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/reference_model.py

  - name: Actor
    description: Performer of enterprise processes — human, team, system, or AI agent. Internal performers; distinct from Stakeholder (external/affected party).
    schema: schemas/entities/actor.json
    ttl: ttl/entities/actor.ttl
    sqlite_table: actors
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/actor.py
    catalog_repo: dea-catalog-actors

  - name: Capability
    description: Business or technical capability that the enterprise possesses or requires.
    schema: schemas/entities/capability.json
    ttl: ttl/entities/capability.ttl
    sqlite_table: capabilities
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/capability.py

  - name: Stakeholder
    description: External or affected party whose relationship with the enterprise is engaged in or affected by enterprise processes. Distinct from Actor (internal performer).
    schema: schemas/entities/stakeholder.json
    ttl: ttl/entities/stakeholder.ttl
    sqlite_table: stakeholders
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/stakeholder.py
    catalog_repo: dea-catalog-stakeholders

  - name: Process
    description: Business or operational process that delivers value. Classified by intent (operational/support/management) and audience (ECF domain). Stakeholders and actors are multi-valued typed references.
    schema: schemas/entities/process.json
    ttl: ttl/entities/process.ttl
    sqlite_table: processes
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/process.py
    catalog_repo: dea-catalog-processes
    docs: docs/process-type-taxonomy.md

  - name: BusinessObject
    description: Real-world entity of interest to the business. The atom of the ECF matrix — every (domain, stage) cell contains the business objects currently in that lifecycle state. Classified by (ecf_domain, ecf_stage) coordinates plus a free-form object_class label.
    schema: schemas/entities/business-object.json
    sqlite_table: business_objects
    ts_interface: src/interfaces.ts
    catalog_repo: dea-catalog-business-objects

  - name: OrganizationalUnit
    description: Unit of organisation (team, division, business unit, governance body, virtual team) that owns capabilities, runs processes, and is custodian for business objects. Classified by (ou_type, ou_scope, ou_lifecycle) structural axes plus optional (ecf_domain, ecf_stage) primary coordinates.
    schema: schemas/entities/organizational-unit.json
    sqlite_table: organizational_units
    ts_interface: src/interfaces.ts
    catalog_repo: dea-catalog-organizational-units

  - name: BusinessService
    description: Service exposed to the business or to external consumers.
    schema: schemas/entities/business-service.json
    ttl: ttl/entities/business-service.ttl
    sqlite_table: business_services
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/business_service.py

  - name: SolutionComponent
    description: Physical or logical software/hardware component that implements capabilities.
    schema: schemas/entities/solution-component.json
    ttl: ttl/entities/solution-component.ttl
    sqlite_table: solution_components
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/solution_component.py
    subtypes:
      - ApplicationComponent
      - InfrastructureComponent
      - IntegrationComponent

  - name: ApplicationComponent
    inherits: SolutionComponent
    description: Application-level component (microservice, module, application).
    schema: schemas/entities/application-component.json
    ttl: ttl/entities/application-component.ttl
    sqlite_table: application_components
    pydantic_model: pydantic/application_component.py

  - name: InfrastructureComponent
    inherits: SolutionComponent
    description: Infrastructure-level component (database, messaging, compute).
    schema: schemas/entities/infrastructure-component.json
    ttl: ttl/entities/infrastructure-component.ttl
    sqlite_table: infrastructure_components
    pydantic_model: pydantic/infrastructure_component.py

  - name: IntegrationComponent
    inherits: SolutionComponent
    description: Integration-level component (API gateway, ESB, ETL pipeline).
    schema: schemas/entities/integration-component.json
    ttl: ttl/entities/integration-component.ttl
    sqlite_table: integration_components
    pydantic_model: pydantic/integration_component.py

  - name: Technology
    description: Technology product, framework, or platform.
    schema: schemas/entities/technology.json
    ttl: ttl/entities/technology.ttl
    sqlite_table: technologies
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/technology.py

  - name: Metric
    description: Measurable indicator used to track EA health and performance.
    schema: schemas/entities/metric.json
    ttl: ttl/entities/metric.ttl
    sqlite_table: metrics
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/metric.py

  - name: GlossaryTerm
    description: Controlled vocabulary term with definition and synonyms.
    schema: schemas/entities/glossary-term.json
    ttl: ttl/entities/glossary-term.ttl
    sqlite_table: glossary_terms
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/glossary_term.py

  - name: TaxonomyNode
    description: Node in a hierarchical taxonomy (capability, technology, domain).
    schema: schemas/entities/taxonomy-node.json
    ttl: ttl/entities/taxonomy-node.ttl
    sqlite_table: taxonomy_nodes
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/taxonomy_node.py

  - name: Viewpoint
    description: Filtered perspective on the metamodel for a specific stakeholder or concern.
    schema: schemas/entities/viewpoint.json
    ttl: ttl/entities/viewpoint.ttl
    sqlite_table: viewpoints
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/viewpoint.py

  - name: BusinessFunction
    description: Grouping of business capabilities by organisational function; owned by an organizational unit (CAP → BF → OU).
    schema: schemas/entities/business-function.json
    ttl: ttl/entities/business-function.ttl
    sqlite_table: business_functions
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/business_function.py

  - name: EcosystemActor
    description: External party that actively exchanges value with the enterprise (L1, ADR-0002).
    schema: schemas/entities/ecosystem-actor.json
    ttl: ttl/entities/ecosystem-actor.ttl
    sqlite_table: ecosystem_actors
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/ecosystem_actor.py

  - name: ValueExchange
    description: Flow of value between the enterprise and an ecosystem actor (L1, ADR-0002).
    schema: schemas/entities/value-exchange.json
    ttl: ttl/entities/value-exchange.ttl
    sqlite_table: value_exchanges
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/value_exchange.py

  - name: CollaborationAgreement
    description: Terms governing cooperation with an ecosystem actor (L1 as of ADR-0002 D2).
    schema: schemas/entities/collaboration-agreement.json
    ttl: ttl/entities/collaboration-agreement.ttl
    sqlite_table: collaboration_agreements
    ts_interface: src/interfaces.ts
    pydantic_model: pydantic/collaboration_agreement.py

relationships:
  - name: mapsTo
    description: General-purpose cross-catalog mapping between any two entities.
    schema: schemas/relationships/mapsTo.json
    ttl: ttl/relationships/mapsTo.ttl
    sqlite_table: rel_maps_to

  - name: realizes
    description: A SolutionComponent or Process delivers a Capability.
    schema: schemas/relationships/realizes.json
    ttl: ttl/relationships/realizes.ttl
    sqlite_table: rel_realizes

  - name: implements
    description: An ArchitecturePattern or SolutionComponent implements a Standard.
    schema: schemas/relationships/implements.json
    ttl: ttl/relationships/implements.ttl
    sqlite_table: rel_implements

  - name: influencedBy
    description: An entity is governed or shaped by a Principle.
    schema: schemas/relationships/influencedBy.json
    ttl: ttl/relationships/influencedBy.ttl
    sqlite_table: rel_influenced_by

  - name: decomposes
    description: A parent Capability breaks down into child Capabilities.
    schema: schemas/relationships/decomposes.json
    ttl: ttl/relationships/decomposes.ttl
    sqlite_table: rel_decomposes

  - name: orchestrates
    description: A parent Process coordinates child Processes.
    schema: schemas/relationships/orchestrates.json
    ttl: ttl/relationships/orchestrates.ttl
    sqlite_table: rel_orchestrates

  - name: consumes
    description: A SolutionComponent uses an external BusinessService.
    schema: schemas/relationships/consumes.json
    ttl: ttl/relationships/consumes.ttl
    sqlite_table: rel_consumes

  - name: provides
    description: A SolutionComponent or Actor provides a BusinessService or Capability.
    schema: schemas/relationships/provides.json
    ttl: ttl/relationships/provides.ttl
    sqlite_table: rel_provides

  - name: governs
    description: A Principle or Standard governs an entity.
    schema: schemas/relationships/governs.json
    ttl: ttl/relationships/governs.ttl
    sqlite_table: rel_governs

  - name: measuredBy
    description: A Metric measures an entity's performance, health, or maturity.
    schema: schemas/relationships/measuredBy.json
    ttl: ttl/relationships/measuredBy.ttl
    sqlite_table: rel_measured_by
