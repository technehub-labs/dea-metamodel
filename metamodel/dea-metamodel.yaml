# DEA Metamodel — NORMATIVE SOURCE (CR-1)
# This file is the single authoritative semantic definition of the OpenDEA metamodel.
# All schemas, database structures, viewer graphs, documentation diagrams and other
# representations MUST be generated from or validated against this specification.
# Change control: every modification requires a CR under change-requests/ and must
# follow docs/versioning.md. Semantic expansion frozen until CR-3 closes (CR-1.6).
metamodel:
  id: opendea
  name: OpenDEA Metamodel
  version: 1.0.0
  status: draft
  normative: true
  namespace:
    uri: https://technehub-labs.github.io/dea-metamodel/
    prefix: dea
  upstream_root:
    repo: technehub-labs/dea-architecture-framework
    model: model/opendeam-model.yaml
    pin: v0.5.0
    relationship: The upstream root model governs enterprise-model allocation (layers, building blocks, dimensions). This
      file is the normative semantic definition of the metamodel itself; the enterprise model consumes and does not redefine
      it.
  component_versions:
    metamodel: 0.6.0
    json_schema: 0.6.0
    sqlite_projection: 0.6.0
    viewer_minimum: 0.1.0
  versioning_policy: docs/versioning.md
  change_control: change-requests/
layers:
- id: L1
  name: Ecosystem & Value Network
  qualifier: External
  color: '#2DD4BF'
  dark_color: '#1B6963'
- id: L2
  name: Strategic & Governance
  qualifier: Intent & Rules
  color: '#FBBF24'
  dark_color: '#785F1D'
- id: L3
  name: Business Operating Model
  qualifier: Internal
  color: '#38BDF8'
  dark_color: '#205E7C'
- id: L4
  name: Digital & Intelligence
  qualifier: Data & Brain
  color: '#A78BFA'
  dark_color: '#52487D'
- id: L5
  name: Technology & Execution
  qualifier: Systems & Infra
  color: '#FB7185'
  dark_color: '#783C48'
dimensions:
- id: ecf-matrix
  name: Enterprise Concept Framework matrix (7×7)
  kind: city-block grid (domain × stage)
- id: measurement-dimension
  name: Measurement Dimension
  kind: cross-cutting evaluative overlay (not a layer as of v0.2.0)
- id: ai-automation-governance
  name: AI & Automation Governance
  kind: cross-cutting policy overlay (not a layer, not "Responsible AI" as a separate structure)
- id: semantic-dimension
  name: Semantic Dimension
  kind: cross-cutting concept graph (not a layer, not a static glossary)
- id: temporal-dimension
  name: Temporal & Lifecycle Dimension
  kind: cross-cutting temporal overlay (CR-6 — time is orthogonal to layers, like measurement)
