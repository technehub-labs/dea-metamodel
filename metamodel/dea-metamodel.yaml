  name: Entity
  legacy_ids:
  - dea:entity-entity
  - Entity
  definition: Abstract root type for all metamodel entities.
  layer: null
  dimension: null
  building_block: null
  abstract: true
  status: normative
  lifecycle: existing
  class_alias: null
  catalog_repo: null
