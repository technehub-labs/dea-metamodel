    types:
    - dea:Actor
    - dea:ApplicationComponent
    - dea:ArchitecturePattern
    - dea:BusinessCapability
    - dea:BusinessProcess
    - dea:Concept
    - dea:DataEntity
    - dea:OrganizationalUnit
    - dea:SolutionComponent
    - dea:SystemFunction
  cardinality:
    source: 0..*
    target: 1..*
  inverse: dea:part-of
  transitive: true
  symmetric: false
  temporal: true
  provenance: optional
  status: normative
  lifecycle: active
  supersedes:
  - decomposes
  - composed of
  - hosted by
- id: dea:aggregates
