- id: dea:composes
  name: Composes
  definition: The target is structurally part of the source and normally has a dependent lifecycle (composition, section 14).
  category: structural
  direction: source-to-target
  source:
    types:
    - dea:ApplicationComponent
    - dea:Blueprint
    - dea:BusinessCapability
    - dea:BusinessProcess
    - dea:Concept
    - dea:DataProduct
    - dea:OrganizationalUnit
    - dea:SolutionComponent
    - dea:SystemFunction
