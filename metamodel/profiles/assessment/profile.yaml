# OpenDEA Assessment Profile (CR-5 §3)
profile:
  id: dea:assessment
  name: OpenDEA Assessment Profile
  version: 1.0.0
  status: normative
  depends_on:
  - dea:core
  scope: Generic assessment and measurement ontology (CR-5 §3-§31). Assessment is a separate semantic
    layer over the architecture graph — maturity is never an intrinsic property of DEA entities (A008).
    DMMv5 and other frameworks plug in as profiles (dea:dmm) over this vocabulary.
  entities:
  - dea:PerformanceMetric
  - dea:Assessment
  - dea:AssessmentFramework
  - dea:AssessmentDimension
  - dea:AssessmentCriterion
  - dea:Indicator
  - dea:Observation
  - dea:Measure
  - dea:Score
  - dea:Scale
  - dea:Unit
  - dea:AssessmentResult
  - dea:AssessmentSubject
  - dea:AssessmentScope
  - dea:AssessmentTarget
  - dea:AssessmentGap
  - dea:MaturityModel
  - dea:MaturityLevel
  - dea:MaturityScale
  - dea:MaturityRule
  - dea:AggregationRule
  - dea:ScoringRule
  - dea:MaturityMappingRule
  - dea:Evidence
  - dea:EvidenceSource
  - dea:EvidenceArtifact
  - dea:Benchmark
  - dea:BenchmarkPopulation
  - dea:BenchmarkReference
  relationships:
  - dea:assesses
  - dea:conducted-under
  - dea:defines
  - dea:quantifies
  - dea:derives-from
  - dea:evaluated-by
  - dea:maps-onto
  - dea:attains
  - dea:addressed-by
  - dea:benchmarked-against
  - dea:scoped-by
  - dea:refers-to
  - dea:originates-from
  vocabulary_files:
  - assessment-entities.yaml
  - assessment-relationships.yaml
  - assessment-constraints.yaml
  cross_references:
  - target: assessment-models/
    kind: internal-sub-tree
    relation: integrates_with
    doc_uri: relative  # file://relative within this repo
    canonical_url: https://github.com/technehub-labs/dea-metamodel/tree/main/assessment-models
    description: >-
      The conceptual model, JSON Schemas, controlled vocabularies, governance
      policy, and maturity scoring v2 that this profile participates in live as
      a coherent sub-tree at `assessment-models/` in this repo. This profile
      defines the OpenDEA-vocabulary surface (`dea:Assessment*`, `dea:Maturity*`,
      `dea:Evidence*`, `dea:Benchmark*` entities and the 13 relationships
      enumerated above); the assessment sub-tree defines the canonical schemas,
      YAML conventions, maturity bands v2, governance, and CHANGELOG for any
      concrete assessment instrument or maturity model that consumes this
      profile. Land additions to this profile and to `assessment-models/`
      together when they are semantically coupled (a new `dea:` entity should
      appear in both `vocabulary_files` here and a controlled vocabulary under
      `assessment-models/vocabulary/`).
    cross_ref_cr: CR-015
  rules:
  - Profiles may extend, specialize, add entities/relationships/classifications/constraints.
  - Profiles MUST NOT redefine Core semantics (CR-4 §29).
  - Assessment results never modify entity identity (A007); maturity is attributed through results, never stored on entities (A008).
