# OpenDEA Digital Profile (CR-4 §28)
profile:
  id: dea:digital
  name: OpenDEA Digital Profile
  version: 1.0.0
  status: draft
  depends_on:
  - dea:core
  scope: Solution/application/integration components, platform services, APIs, information system functions, events, patterns, blueprints.
  entities:
  - dea:API
  - dea:ApplicationComponent
  - dea:ArchitecturePattern
  - dea:Blueprint
  - dea:Event
  - dea:InformationSystemFunction
  - dea:IntegrationComponent
  - dea:PlatformService
  - dea:SolutionComponent
  - dea:SystemFunction  # DEPRECATED 2026-10-16 per CR-018 / D-1. Retained for EGV-004 identity continuity.
  rules:
  - Profiles may extend, specialize, add entities/relationships/classifications/constraints.
  - Profiles MUST NOT redefine Core semantics (CR-4 §29).
