# OpenDEA Digital Profile (CR-4 §28)
profile:
  id: dea:digital
  name: OpenDEA Digital Profile
  version: 1.0.0
  status: draft
  depends_on:
  - dea:core
  scope: Solution/application/integration components, platform services, APIs, information system functions, events, patterns, blueprints.
  entities:
  - dea:API
  - dea:ApplicationComponent
  - dea:ArchitecturePattern
  - dea:Blueprint
  - dea:Event
  - dea:InformationSystemComponent  # CR-019; abstract kind that ApplicationComponent and IntegrationComponent specialise (D-2 disposition)
  - dea:InformationSystemFunction
  - dea:InformationSystemService   # CR-020; specialises Core dea:Service (D-3 disposition)
  - dea:IntegrationComponent  # now specialises dea:InformationSystemComponent (CR-019)
  - dea:IntegrationInterface   # CR-021; interaction boundary (D-4 disposition; audit-then-specifies)
  - dea:PlatformService        # CR-020 D-3: when genuinely an IS service, specialises dea:InformationSystemService
  - dea:SolutionComponent
  - dea:SystemFunction  # DEPRECATED 2026-10-16 per CR-018 / D-1. Retained for EGV-004 identity continuity.
  rules:
  - Profiles may extend, specialize, add entities/relationships/classifications/constraints.
  - Profiles MUST NOT redefine Core semantics (CR-4 §29).
