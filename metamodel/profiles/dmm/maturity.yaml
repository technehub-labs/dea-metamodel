  - {id: dmmv5:maturity/2, order: 2, name: Developing, kind: dea:MaturityLevel}
  - {id: dmmv5:maturity/3, order: 3, name: Defined,    kind: dea:MaturityLevel}
  - {id: dmmv5:maturity/4, order: 4, name: Managed,    kind: dea:MaturityLevel}
  - {id: dmmv5:maturity/5, order: 5, name: Optimized,  kind: dea:MaturityLevel}
