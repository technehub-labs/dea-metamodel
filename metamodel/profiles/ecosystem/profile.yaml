# OpenDEA Ecosystem Profile (CR-4 §28)
profile:
  id: dea:ecosystem
  name: OpenDEA Ecosystem Profile
  version: 1.0.0
  status: draft
  depends_on:
  - dea:core
  - dea:business
  scope: External actors, platforms, agreements and value exchanges.
  entities:
  - dea:CollaborationAgreement
  - dea:EcosystemActor
  - dea:EcosystemPlatform
  - dea:JourneyTouchpoint
  - dea:Stakeholder
  - dea:ValueExchange
  rules:
  - Profiles may extend, specialize, add entities/relationships/classifications/constraints.
  - Profiles MUST NOT redefine Core semantics (CR-4 §29).
