# CR-8 §5 canonical OpenDEA vocabulary — GENERATED, do not edit
vocabulary_version: 1.0.0
namespace: https://technehub-labs.github.io/dea-metamodel/
prefix: dea
concepts:
- id: dea:Entity
  name: Entity
  canonical_name: Entity
  definition: Abstract root type for all metamodel entities.
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:CollaborationAgreement
  name: Collaboration Agreement
  canonical_name: CollaborationAgreement
  definition: Terms governing cooperation with an ecosystem actor — cooperative or mandated.
  semantic_category: dea:ecosystem
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:EcosystemActor
  name: Ecosystem Actor
  canonical_name: EcosystemActor
  definition: External party that actively exchanges value with the enterprise — supplier, customer, regulator, partner.
  semantic_category: dea:ecosystem
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:EcosystemPlatform
  name: Ecosystem Platform
  canonical_name: EcosystemPlatform
  definition: A standing multi-sided structure the enterprise hosts for repeated exchange among many ecosystem actors (marketplace,
    partner API program, developer portal).
  semantic_category: dea:ecosystem
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:JourneyTouchpoint
  name: Journey Touchpoint
  canonical_name: JourneyTouchpoint
  definition: A point of interaction on a customer or user journey, across a specific channel.
  semantic_category: dea:ecosystem
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Stakeholder
  name: Stakeholder
  canonical_name: Stakeholder
  definition: An external or affected party whose relationship with the enterprise is engaged in or affected by enterprise
    processes.
  semantic_category: dea:ecosystem
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ValueExchange
  name: Value Exchange
  canonical_name: ValueExchange
  definition: A flow of value between the enterprise and an ecosystem actor — information, goods, or funds; inbound or outbound.
  semantic_category: dea:ecosystem
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ArchitecturePattern
  name: Architecture Pattern
  canonical_name: ArchitecturePattern
  definition: A reusable architecture pattern (e.g. API Gateway, Event Sourcing, CQRS) that resolves a recurring design problem.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Blueprint
  name: Blueprint
  canonical_name: Blueprint
  definition: A composed, reusable target-state design assembled from Architecture Patterns, providing a template for solution
    design.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Control
  name: Control
  canonical_name: Control
  definition: A mechanism (process, technical, or organizational) that mitigates a Risk or enforces a Regulation.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Experiment
  name: Experiment
  canonical_name: Experiment
  definition: A bounded, time-boxed test of a Signal's relevance to the enterprise before committing investment.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Guardrail
  name: Guardrail
  canonical_name: Guardrail
  definition: 'An enforceable constraint on technology or solution choices. Carries an enforcement maturity level (advisory
    | automated-warn | automated-block | platform-enforced) — modeling policy-as-code / platform-guardrail practice rather
    than a static compliance document someone checks against manually.

    '
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:InvestmentInitiative
  name: Investment Initiative
  canonical_name: InvestmentInitiative
  definition: A funded programme of work that realises one or more strategic objectives.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Regulation
  name: Regulation
  canonical_name: Regulation
  definition: An externally imposed obligation (law, industry standard with force, contractual mandate) the enterprise must
    comply with.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Risk
  name: Risk
  canonical_name: Risk
  definition: A condition or event that threatens the enterprise's ability to persist or to realize a capability/objective.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Signal
  name: Signal
  canonical_name: Signal
  definition: A weak or early indicator of environmental change (market, technology, regulatory, competitive) worth tracking
    before it forces adaptation.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:StrategicObjective
  name: Strategic Objective
  canonical_name: StrategicObjective
  definition: A high-level enterprise outcome the organisation seeks to achieve.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Tenet
  name: Tenet
  canonical_name: Tenet
  definition: A non-binding, human-authored belief that guides decisions (e.g. API-first, prefer managed services). Informs
    one or more Guardrails; enforces nothing on its own.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:TechnologyRadarEntry
  name: Technology Radar Entry
  canonical_name: TechnologyRadarEntry
  definition: An emerging technology or technique being tracked (assess/trial/adopt/hold) prior to becoming a governed L5
    Technology.
  semantic_category: dea:technology
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Actor
  name: Actor
  canonical_name: Actor
  definition: A performer of enterprise processes — human, team, system, or AI agent.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:BusinessFunction
  name: Business Function
  canonical_name: BusinessFunction
  definition: A grouping of business capabilities by organisational function; owned by an organizational unit.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:BusinessObject
  name: Business Object
  canonical_name: BusinessObject
  definition: A real-world entity of interest to the business (e.g. Customer, Order). The atom of the ECF matrix.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Process
  name: Process
  canonical_name: Process
  definition: A structural organization of activities into a meaningful temporal/causal pattern, grounded in the WSF Process
    discipline (wsf:Process; WSF Foundational Semantic Synthesis §6; Tier-3 derived construct). Abstract root of all Process
    kinds; kinds are specializations per WSF ADR-WSF-04 and live in the Core (for the first kind) or in profiles (for non-first
    kinds). Federation mapping `dea:Process` ↔ `wsf:Process` (ALIGNED; per WSF ADR-WSF-07 precedent used by `dea:Capability`
    ↔ `wsf:Capability`).
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:BusinessProcess
  name: Business Process
  canonical_name: BusinessProcess
  definition: A structured set of activities that produces a defined outcome. Specializes dea:Process (CR-MM-PROC-01; ADR-015
    precedent; WSF ADR-WSF-04). Supports Business Architecture and Business Operations use cases. Sub-classifications (operational
    / support / management via the catalog's `process_intent` field) are catalog-internal, not kernel entities.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:BusinessService
  name: Business Service
  canonical_name: BusinessService
  definition: A service exposed to the business or to external consumers. Composite of capabilities, realised by solution
    components.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Capability
  name: Capability
  canonical_name: Capability
  definition: An attributable, contextualized potential of an Entity to accomplish a defined kind of effect, grounded in capacity
    and ability within a defined context. Aligned 1:1 with wsf:Capability (ADR-015; WSF ADR-WSF-07). Abstract root of all
    capability kinds; kinds are specializations per WSF ADR-WSF-04 and live in profiles (ADR-002).
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:BusinessCapability
  name: Business Capability
  canonical_name: BusinessCapability
  definition: 'An ability the business possesses or requires to deliver value. Maps to ECF coordinates. Specializes dea:Capability
    (ADR-015): contributes to a business outcome, owned by the business, mapped to ECF coordinates.'
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:SystemCapability
  name: System Capability
  canonical_name: SystemCapability
  definition: 'A capability whose bearer is a system or application and which enables a system function. Specializes dea:Capability
    (ADR-015; ADR-WSF-04): parent meaning plus bearer constraint. Example: KYC Identity Verification.'
  semantic_category: dea:technology
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:InfrastructureCapability
  name: Infrastructure Capability
  canonical_name: InfrastructureCapability
  definition: 'A capability whose bearer is infrastructure and which enables platform or runtime services. Specializes dea:Capability
    (ADR-015; ADR-WSF-04): parent meaning plus bearer constraint. Example: Data Encryption-at-Rest.'
  semantic_category: dea:technology
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AIAugmentedCapability
  name: AI-Augmented Capability
  canonical_name: AI-AugmentedCapability
  definition: 'A capability whose realisation depends on a model or agent. Specializes dea:Capability (ADR-015; ADR-WSF-04):
    parent meaning plus realisation constraint; subject to the AI & Automation Governance dimension. Example: Algorithmic
    Credit Scoring.'
  semantic_category: dea:ai
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ChangeInitiative
  name: Change Initiative
  canonical_name: ChangeInitiative
  definition: A deliberate effort to shift Skills, Roles, or culture within an Organizational Unit, typically funded by an
    Investment Initiative.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:FinancialResource
  name: Financial Resource
  canonical_name: FinancialResource
  definition: Liquid or near-liquid economic value the enterprise holds (accounts, instruments, funding lines). Catalog instances
    include cash, credit facilities, and similar.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:IntangibleResource
  name: Intangible Resource
  canonical_name: IntangibleResource
  definition: Legally protected non-physical economic value (patents, trademarks, brand equity, licenses). Catalog instances
    include a specific trademark registration or license.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:OrganizationalUnit
  name: Organizational Unit
  canonical_name: OrganizationalUnit
  definition: A unit of organisation that owns capabilities, runs processes, and is custodian for business objects.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:PhysicalResource
  name: Physical Resource
  canonical_name: PhysicalResource
  definition: Tangible assets requiring an ongoing maintenance regime (equipment, vehicles, premises, inventory stock). Catalog
    instances include an oven, a van, a warehouse shelf.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Resource
  name: Resource
  canonical_name: Resource
  definition: The economic/physical substrate a bounded entity maintains to persist, distinct from what it exchanges (L1)
    or builds digitally (L4/L5).
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Role
  name: Role
  canonical_name: Role
  definition: A defined set of required Skills and responsibilities that an Actor fulfills within an Organizational Unit.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:SolutionComponent
  name: Solution Component
  canonical_name: SolutionComponent
  definition: 'Abstract parent of ApplicationComponent, InfrastructureComponent, IntegrationComponent (discriminated union
    by component_type). Concrete subclasses are allocated to L5; see specializes on APC/IFC/IGC below. (ADR-0002 D3)

    '
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Skill
  name: Skill
  canonical_name: Skill
  definition: A capability an individual Actor possesses or must develop. Distinct from Business Capability, which belongs
    to the enterprise, not a person.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ValueStream
  name: Value Stream
  canonical_name: ValueStream
  definition: An end-to-end collection of value-creating activities spanning multiple capabilities and processes.
  semantic_category: dea:business
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AIMLModel
  name: AI/ML Model
  canonical_name: AI/MLModel
  definition: A machine-learning or AI model that augments or replaces human decision-making within a capability. May declare
    governed_by (RSK/CTL/REG ids) per the ai-automation-governance dimension.
  semantic_category: dea:ai
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:DataEntity
  name: Data Entity
  canonical_name: DataEntity
  definition: A persistent data structure (table, document, graph node) that realises one or more business objects.
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:DigitalIdentity
  name: Digital Identity
  canonical_name: DigitalIdentity
  definition: A digital representation (twin) of a stakeholder or actor for authentication, authorisation, and traceability.
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:DataProduct
  name: Data Product
  canonical_name: DataProduct
  definition: A curated, discoverable, governed dataset or data service with clear ownership and SLAs (data-mesh pattern).
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Event
  name: Event
  canonical_name: Event
  definition: A significant state change or business occurrence that business objects participate in.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:InformationAsset
  name: Information Asset
  canonical_name: InformationAsset
  definition: Data given context and form for a specific consuming purpose (a report, dashboard, invoice) — distinct from
    the raw Data Entity it's contextualized from.
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:InformationClass
  name: Information Class
  canonical_name: InformationClass
  definition: A classification of information by sensitivity and regulatory regime (PII, PHI, PCI).
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:KnowledgeAsset
  name: Knowledge Asset
  canonical_name: KnowledgeAsset
  definition: Applied know-how made explicit and durable, existing independent of any one Actor — distinct from Skill (L3),
    which an Actor personally possesses.
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ModelDeployment
  name: Model Deployment
  canonical_name: ModelDeployment
  definition: A running instance of an AI/ML Model, hosted on an Application Component, with its own version, monitoring state,
    and health.
  semantic_category: dea:ai
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ModelFeedbackSignal
  name: Model Feedback Signal
  canonical_name: ModelFeedbackSignal
  definition: Drift, performance-degradation, or outcome-quality feedback captured from Events, used to trigger retraining
    of an AI/ML Model.
  semantic_category: dea:ai
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ApplicationComponent
  name: Application Component
  canonical_name: ApplicationComponent
  definition: A deployable unit of an application system. SubClass of SolutionComponent with component_type='application'.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:API
  name: API
  canonical_name: API
  definition: A contract defining the request/response shape of a service interface.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:InfrastructureComponent
  name: Infrastructure Component
  canonical_name: InfrastructureComponent
  definition: An IaC-managed resource that hosts solution components. SubClass of SolutionComponent with component_type='infrastructure'.
  semantic_category: dea:technology
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:IntegrationComponent
  name: Integration Component
  canonical_name: IntegrationComponent
  definition: A component that bridges systems via APIs, queues, file transfers. SubClass of SolutionComponent with component_type='integration'.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:PlatformService
  name: Platform Service
  canonical_name: PlatformService
  definition: A shared infrastructure or runtime service consumed by multiple application components.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:SystemFunction
  name: System Function
  canonical_name: SystemFunction
  definition: A functional capability exposed by a single application or system.
  semantic_category: dea:digital
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Technology
  name: Technology
  canonical_name: Technology
  definition: A technology choice (language, framework, runtime, database) governed via Guardrails, motivated by Tenets.
  semantic_category: dea:technology
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Concept
  name: Concept
  canonical_name: Concept
  definition: 'A canonical, definable unit of meaning (business term or classification node) that other entities link to via
    defined_by. Merged from Glossary Term + Taxonomy Node in v0.4.0 (ADR-0004 D2); framed as a queryable concept graph, not
    a static glossary document. No longer allocated to a layer/building_block — belongs to orthogonal_allocators.semantic-dimension.

    '
  semantic_category: dea:data
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:PerformanceMetric
  name: Performance Metric
  canonical_name: PerformanceMetric
  definition: 'A measured quantity used to evaluate outcomes against targets. MECE taxonomy: kpi | health | maturity | performance
    | adoption | compliance | risk. No longer allocated to a layer/building_block as of v0.2.0 — belongs to orthogonal_allocators.measurement-dimension
    instead (ADR-0002 D1).

    '
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ArchitectureElement
  name: ArchitectureElement
  canonical_name: ArchitectureElement
  definition: An identifiable element that participates in an architectural description of an enterprise (CR-4 §5). Not merely
    anything that appears in the repository.
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:Behavior
  name: Behavior
  canonical_name: Behavior
  definition: 'Abstract concept for enterprise activity (CR-4 §9). Profiles specialize: Process, Activity, Workflow, BusinessFunction,
    AgentTask, Automation.'
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:Service
  name: Service
  canonical_name: Service
  definition: A means through which a provider exposes value or capability to a consumer without requiring the consumer to
    manage the underlying implementation (CR-4 §10).
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:Information
  name: Information
  canonical_name: Information
  definition: Abstract foundation for all information specializations (CR-4 §12). Profiles define DataEntity, BusinessObject,
    InformationAsset, KnowledgeAsset, DataProduct, Dataset.
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:Organization
  name: Organization
  canonical_name: Organization
  definition: Organizational structure, distinct from Actor agency (CR-4 §7). An organization can act as an Actor; structure
    and agency are different semantic concerns.
  semantic_category: core
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:Decision
  name: Decision
  canonical_name: Decision
  definition: A determination made by an Actor, system or Agent that selects or authorizes a course of action based on information,
    rules, objectives and constraints (CR-4 §13). Foundation for agentic architecture (CR-7).
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Outcome
  name: Outcome
  canonical_name: Outcome
  definition: A resulting state or value (CR-4 §14). Capability is an ability; Outcome is a result. Anchor for strategy, value,
    DMM, transformation and measurement.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Requirement
  name: Requirement
  canonical_name: Requirement
  definition: 'A stated need, obligation or condition that an architecture, solution, service or behavior must satisfy (CR-4
    §15). Profiles specialize: business, regulatory, security, data, technology, AI.'
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Constraint
  name: Constraint
  canonical_name: Constraint
  definition: 'Something that limits the possible solution space (CR-4 §16). Distinct from Requirement: a Requirement must
    be satisfied; a Constraint limits options.'
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Change
  name: Change
  canonical_name: Change
  definition: A deliberate modification to enterprise capabilities, behavior, services, information, technology, organization
    or operating model (CR-4 §17). Foundation for transformation, roadmap, transition architecture and migration.
  semantic_category: core
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Assessment
  name: Assessment
  canonical_name: Assessment
  definition: A structured evaluation of one or more subjects against an assessment framework at a defined point or period
    in time (CR-5 §4). The evaluation event — never an attribute of the subject.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentFramework
  name: Assessment Framework
  canonical_name: AssessmentFramework
  definition: The external methodology used to conduct an assessment — its dimensions, criteria, indicators, scoring, maturity
    model and evidence requirements (CR-5 §5). External to the subject being assessed and versioned independently of OpenDEA
    Core (CR-5 §33).
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentDimension
  name: Assessment Dimension
  canonical_name: AssessmentDimension
  definition: 'A structured perspective through which a subject is evaluated (CR-5 §6). An assessment perspective, not an
    architectural entity: a DMM dimension never becomes equivalent to the DEA entities it assesses.'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentCriterion
  name: Assessment Criterion
  canonical_name: AssessmentCriterion
  definition: Defines what is evaluated within a dimension — id, name, definition, applicability and evaluation guidance (CR-5
    §7). A criterion never contains the result of an evaluation.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Indicator
  name: Indicator
  canonical_name: Indicator
  definition: The observable signal used to evaluate a criterion (CR-5 §8). Criterion = what we evaluate; Indicator = what
    we observe; Measure = what we quantify; Result = what was assessed.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Observation
  name: Observation
  canonical_name: Observation
  definition: A raw measured or observed fact collected as input to assessment (CR-5 §27), e.g. '78% of applications have
    documented architecture'. Distinct from the derived result it may inform.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Measure
  name: Measure
  canonical_name: Measure
  definition: A quantifiable observation of an indicator — value, unit, observation time and source (CR-5 §9). The unit is
    referenced, never encoded into the entity name.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Score
  name: Score
  canonical_name: Score
  definition: A numerical or ordinal evaluation derived from measures against a declared scale (CR-5 §11). A score is not
    intrinsically a maturity level; the framework defines the transformation.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Scale
  name: Scale
  canonical_name: Scale
  definition: A declared ordered value space for scores and measures (CR-5 Phase 2; A004) — e.g. a 0..1 ratio or a 1..5 ordinal
    range.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Unit
  name: Unit
  canonical_name: Unit
  definition: A standard quantity in which a measure is expressed (CR-5 §9/Phase 2) — percent, ratio, months, currency, count.
    Referenced by measures; never embedded in names.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentResult
  name: Assessment Result
  canonical_name: AssessmentResult
  definition: 'The central object connecting assessment to architecture (CR-5 §10): subject, criterion, score or maturity
    level, evidence, confidence, assessor, framework and temporal anchors. A result never modifies the identity of the assessed
    entity (A007).'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentSubject
  name: Assessment Subject
  canonical_name: AssessmentSubject
  definition: The thing being evaluated — a reference to a DEA entity at an explicit scope (CR-5 §14). Allows the same entity
    to be assessed at different organizational scopes.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentScope
  name: Assessment Scope
  canonical_name: AssessmentScope
  definition: The explicit boundary of an assessment (CR-5 §15), modeled as references to actual enterprise entities wherever
    possible rather than free-text labels.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentTarget
  name: Assessment Target
  canonical_name: AssessmentTarget
  definition: A desired future value or maturity level for a subject and criterion, with target date, rationale and approver
    (CR-5 §21). Targets live in the assessment layer — never on the architectural entity.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AssessmentGap
  name: Assessment Gap
  canonical_name: AssessmentGap
  definition: The derived difference between a current result and a target (CR-5 §30). Gaps are derived, never authoritative
    source data; the authoritative data are current state and target state. Gaps connect assessment to transformation via
    addressed-by → Change (CR-5 §31).
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:MaturityModel
  name: Maturity Model
  canonical_name: MaturityModel
  definition: An ordered set of maturity levels defined, governed and versioned by an assessment framework (CR-5 §12/§33).
    Maturity belongs to the framework, not to any architectural entity (CR-5 §13).
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:MaturityLevel
  name: Maturity Level
  canonical_name: MaturityLevel
  definition: A named, ordered position within a maturity model (CR-5 §12). Belongs to the referenced maturity model (A005);
    results attain levels — entities never carry them intrinsically (A008).
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:MaturityScale
  name: Maturity Scale
  canonical_name: MaturityScale
  definition: The scale over which a maturity model's levels are defined (CR-5 §12), e.g. a 1..5 ordered range.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:MaturityRule
  name: Maturity Rule
  canonical_name: MaturityRule
  definition: A framework-defined rule mapping scores or measures to maturity levels, including gating criteria and maturity
    ceilings (CR-5 §12/§26).
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AggregationRule
  name: Aggregation Rule
  canonical_name: AggregationRule
  definition: 'Declares how lower-level results combine into higher-level results (CR-5 §25): weighted averages, minimum thresholds,
    gating criteria, ceilings, qualitative judgement, evidence sufficiency or rule-based scoring. Never assumed to be a simple
    arithmetic mean (A009).'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ScoringRule
  name: Scoring Rule
  canonical_name: ScoringRule
  definition: Declares how measures become scores within a framework (CR-5 §11/§25). The framework — not the ontology — defines
    the transformation.
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:MaturityMappingRule
  name: Maturity Mapping Rule
  canonical_name: MaturityMappingRule
  definition: 'Declares how scores map to maturity levels within a framework (CR-5 §11/§25): Measure → Score → Scoring Rule
    → Maturity Level.'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Evidence
  name: Evidence
  canonical_name: Evidence
  definition: 'First-class support for an assessment result (CR-5 §16): document, inventory, interview, survey, metric, audit
    report, process observation, system log, API measurement or control test — with provenance, validity and confidence. Evidence
    supports a result; it is not the result (CR-5 §17).'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:EvidenceSource
  name: Evidence Source
  canonical_name: EvidenceSource
  definition: 'The origin from which evidence is collected (CR-5 §16): a system, document store, interview programme, survey
    instrument, audit, log pipeline or API endpoint.'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:EvidenceArtifact
  name: Evidence Artifact
  canonical_name: EvidenceArtifact
  definition: 'A concrete artifact referenced as evidence (CR-5 §16): an architecture document, system inventory, audit report,
    log extract or control test record.'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Benchmark
  name: Benchmark
  canonical_name: Benchmark
  definition: 'A comparative reference external to the enterprise''s own assessment (CR-5 §28). Benchmarking is modeled separately
    from assessment: AssessmentResult ≠ Benchmark and AssessmentTarget ≠ Benchmark (A011).'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:BenchmarkPopulation
  name: Benchmark Population
  canonical_name: BenchmarkPopulation
  definition: The peer or industry population over which a benchmark is computed (CR-5 §28).
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:BenchmarkReference
  name: Benchmark Reference
  canonical_name: BenchmarkReference
  definition: 'A specific comparative value drawn from a benchmark population (CR-5 §28): industry level, peer median, percentile.
    Compared against results via benchmarked-against — never treated as a result (A011).'
  semantic_category: dea:assessment
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:TemporalInterval
  name: TemporalInterval
  canonical_name: TemporalInterval
  definition: 'A bounded or open interval on one or more of the OpenDEA clocks (CR-6 §5): valid time (valid_from/valid_to),
    transaction time (recorded_at), observation time (observed_at), planned time (planned_start/planned_end) and effective
    time (effective_from/effective_to). The clocks are not interchangeable (§6): knowing a retirement in Aug 2026 for Jan
    2027 produces recorded_at, planned and valid_to as three different facts.'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:TemporalEvent
  name: TemporalEvent
  canonical_name: TemporalEvent
  definition: 'Abstract anchor for something that happened at a point in time (CR-6 §3/§29). An event is not a state: events
    occur; states are the conditions that result from events. Specialized by LifecycleEvent.'
  semantic_category: dea:lifecycle
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:TemporalState
  name: TemporalState
  canonical_name: TemporalState
  definition: Abstract anchor for a condition that holds over a temporal extent (CR-6 §3/§29). Specialized by LifecycleState
    and ArchitectureState.
  semantic_category: dea:lifecycle
  abstract: true
  status: normative
  version: 1.0.0
- id: dea:LifecycleState
  name: LifecycleState
  canonical_name: LifecycleState
  definition: 'An explicit operational state of a lifecycle-aware entity (CR-6 §7). Lifecycle state is defined by the entity
    type or profile — never blindly uniform — and is distinct from maturity level (§8): an Application can be Active while
    its Capability is assessed at Level 3.'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:LifecycleEvent
  name: LifecycleEvent
  canonical_name: LifecycleEvent
  definition: 'An auditable event that moves a subject through its lifecycle (CR-6 §28): created, approved, activated, modified,
    suspended, deprecated, retired, reactivated, superseded. Captures subject, timestamp, actor, reason and source — the raw
    material of architectural history (§17).'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:LifecycleTransition
  name: LifecycleTransition
  canonical_name: LifecycleTransition
  definition: A declared, allowed movement between two LifecycleStates for an entity scope (CR-6 §7; T002). Retired → Active
    is impossible unless an explicit reactivation transition is declared.
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Transition
  name: Transition
  canonical_name: Transition
  definition: 'The movement between two architecture states, caused by a Change (CR-6 §14): from-state, to-state, causing
    change, planned/actual start and end, and status. A planned transition is never actual architecture (§2/§16).'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ArchitectureState
  name: ArchitectureState
  canonical_name: ArchitectureState
  definition: 'A coherent representation of the enterprise architecture at a defined temporal point or condition (CR-6 §9):
    contains elements, valid-during an interval. Architecture is a time-dependent state of the enterprise, not a static catalogue
    (§1). Specialized as Baseline/Current/Target/Transition/Scenario states.'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:BaselineState
  name: BaselineState
  canonical_name: BaselineState
  definition: A formally adopted reference state of the architecture (CR-6 §10) — a declared snapshot, not 'whatever the model
    happens to contain'. A snapshot may become a baseline (§31); they are not the same thing.
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:CurrentState
  name: CurrentState
  canonical_name: CurrentState
  definition: 'The best authoritative representation of what exists at a specified time (CR-6 §11): actual elements, actual
    relationships, actual lifecycle states. Planned, proposed, target and hypothetical elements are excluded (T003).'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:TargetState
  name: TargetState
  canonical_name: TargetState
  definition: An intended future condition of the architecture (CR-6 §12). Target ≠ Current, Target ≠ Planned Change, Target
    ≠ Forecast (§27). Target-state entities must never be read as current-state (T006).
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:TransitionState
  name: TransitionState
  canonical_name: TransitionState
  definition: 'An intermediate architecture state between Current and Target (CR-6 §13): real transformation moves Current
    → Transition 1 → … → Target, never in one jump.'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Scenario
  name: Scenario
  canonical_name: Scenario
  definition: A hypothetical architecture exploration under a defined set of assumptions (CR-6 §25) — e.g. cloud-first vs
    hybrid vs on-premise modernization. A scenario is not necessarily the approved target, and must never contaminate the
    authoritative architecture (T007).
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ScenarioState
  name: ScenarioState
  canonical_name: ScenarioState
  definition: A hypothetical architecture state contained within a Scenario (CR-6 §25/§26). Scenario elements live inside
    the scenario container — they are never inserted into CurrentState (T007).
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ScenarioAssumption
  name: ScenarioAssumption
  canonical_name: ScenarioAssumption
  definition: A declared assumption under which a Scenario holds (CR-6 §25). Assumptions make the difference between a scenario
    and a target explicit and auditable.
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ArchitectureSnapshot
  name: ArchitectureSnapshot
  canonical_name: ArchitectureSnapshot
  definition: A captured representation of the architecture at a point in time (CR-6 §30) — for audits, regulatory reporting,
    maturity assessment, historical comparison and transformation governance. Approved snapshots are immutable except through
    explicit revision semantics (T010). A snapshot may become a baseline; it is not one by default (§31).
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ArchitectureDelta
  name: ArchitectureDelta
  canonical_name: ArchitectureDelta
  definition: 'The semantic difference between two architecture states (CR-6 §32): added, removed, modified, replaced, reclassified
    elements and relationship changes. The native answer to ''what must change to move from here to there?'' — the bridge
    between DMM, target architecture, transformation and roadmaps (§33). Deltas are derived, never hand-authored.'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Version
  name: Version
  canonical_name: Version
  definition: 'An identity-evolution marker of a versioned entity (CR-6 §18/§19): v1.0 → v1.1 → v2.0 says nothing about operational
    state. Version, lifecycle and temporal validity are three different concepts; version-of and superseded-by are different
    relationships (§20). Version chains are acyclic (T008).'
  semantic_category: dea:lifecycle
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Intent
  name: Intent
  canonical_name: Intent
  definition: 'The desired direction or purpose behind an architectural or organizational decision (CR-7 §3) — e.g. improve
    customer experience, increase resilience, become AI-enabled. Intent is not a goal metric: Intent motivates Objective,
    Objective is measured, Outcome is what actually happened (§6).'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Objective
  name: Objective
  canonical_name: Objective
  definition: 'Makes an Intent operationally measurable (CR-7 §5): statement, target value, unit, target date. Objective ≠
    Outcome (§6): an objective is what we intend to achieve; an outcome is what happened. Connects to CR-5 via AssessmentTarget.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Policy
  name: Policy
  canonical_name: Policy
  definition: 'A governing principle or rule that constrains or directs behavior (CR-7 §7), applicable to organizations, capabilities,
    processes, services, applications, data, technology, agents, decisions and changes (§8). Policy ≠ Constraint (§9): a policy
    directs; a constraint limits.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:PolicyRule
  name: PolicyRule
  canonical_name: PolicyRule
  definition: An atomic, evaluable rule within a Policy (CR-7 §7/§38) — the unit policy enforcement evaluates.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:PolicyEvaluation
  name: PolicyEvaluation
  canonical_name: PolicyEvaluation
  definition: 'The evaluation of an action or subject against a policy (CR-7 §38): policy, subject, action, context, result,
    reason, timestamp. Produces a PolicyDecision (§39).'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:PolicyDecision
  name: PolicyDecision
  canonical_name: PolicyDecision
  definition: The outcome of a policy evaluation — e.g. 'Agent A is permitted to access Dataset X' (CR-7 §39). Not the same
    as an enterprise Decision ('deploy Agent A'); the two are kept separate.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:DecisionOption
  name: DecisionOption
  canonical_name: DecisionOption
  definition: An alternative considered in a Decision (CR-7 §14), with cost, benefit, risk, constraint violations, expected
    outcome, dependencies, time and confidence. Makes decision-making explicit rather than burying rationale in documents.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:DecisionCriterion
  name: DecisionCriterion
  canonical_name: DecisionCriterion
  definition: 'A criterion by which decision options are evaluated (CR-7 §15): strategic alignment, cost, risk, time-to-value,
    security, regulatory compliance, customer impact, complexity, resilience.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:DecisionRecord
  name: DecisionRecord
  canonical_name: DecisionRecord
  definition: 'The audit record of a Decision (CR-7 §11): who/what decided, what, why, on what evidence, under what authority,
    among which alternatives, with what consequences.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Authority
  name: Authority
  canonical_name: Authority
  definition: 'The right to decide or act within defined limits (CR-7 §18). Capability to perform an action is not authority
    to perform it: an agent may be capable of approving transactions yet authorized only up to $10,000. This distinction is
    structural, not documentary.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Delegation
  name: Delegation
  canonical_name: Delegation
  definition: The act of granting authority from a delegator to a delegate (CR-7 §19) with explicit scope, constraints, duration,
    conditions and revocation (G005).
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:GovernanceBody
  name: GovernanceBody
  canonical_name: GovernanceBody
  definition: 'A body that sets policy, grants authority, reviews decisions, approves changes, monitors outcomes and enforces
    constraints (CR-7 §34): Architecture Review Board, AI Governance Board, Data Governance Council, Security Committee, Executive
    Steering Committee.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:GovernanceRule
  name: GovernanceRule
  canonical_name: GovernanceRule
  definition: A rule established by a GovernanceBody (CR-7 §34) as part of the governance mechanism.
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Action
  name: Action
  canonical_name: Action
  definition: 'A unit of execution that follows from a Decision (CR-7 §13). Decision ≠ Action: ''approve migration'' vs ''execute
    migration''. Performed by an Actor or Agent (§65) within authority and policy boundaries; reversibility is explicit (§41)
    and drives control strictness.'
  semantic_category: dea:governance
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Agent
  name: Agent
  canonical_name: Agent
  definition: 'An autonomous or semi-autonomous actor capable of perceiving information, reasoning or evaluating conditions,
    and initiating or executing actions within a defined authority and policy boundary (CR-7 §20). Broader than ''AI model''
    (§21): an Agent has identity, purpose, capabilities, knowledge, tools, policies, authority, goals, state, memory, decision
    mechanism, actions and observability. An Agent is a participant in the enterprise semantic system — not its center (§1).'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AgentProfile
  name: AgentProfile
  canonical_name: AgentProfile
  definition: 'The formal profile of an Agent (CR-7 §22): purpose, objectives, capabilities, knowledge, models, tools, policies,
    authority, decision/action scope, autonomy level, human oversight, memory, state, inputs, outputs, risks, controls, owner
    and lifecycle — placed inside the DEA semantic model rather than an isolated template.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AgentSkill
  name: AgentSkill
  canonical_name: AgentSkill
  definition: 'A reusable capability/competency available to an Agent (CR-7 §48/§49): purpose, inputs, outputs, preconditions,
    postconditions, tools, policies, decision/action scope, failure modes and escalation. AgentSkill ≠ BusinessCapability
    (§48): a skill may implement or contribute to one.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Tool
  name: Tool
  canonical_name: Tool
  definition: 'An executable mechanism available to an Agent (CR-7 §30): CRM/ERP APIs, search, databases, workflow engines,
    payment services, code execution, knowledge graphs. Tool ≠ Service (§31): a Service exposes enterprise capability for
    consumption; a Tool is an invocable mechanism. They may overlap operationally but are semantically distinct.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:ToolPermission
  name: ToolPermission
  canonical_name: ToolPermission
  definition: 'Explicit permission governing an Agent''s access to a Tool (CR-7 §30; G009): scope, constraints and authority.
    Tool access is never implicit.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Orchestrator
  name: Orchestrator
  canonical_name: Orchestrator
  definition: Coordinates multiple actors, agents, services and workflows toward a goal (CR-7 §46/§47). Distinct from Agent
    (bounded cognitive/action role) and Controller (enforces execution/state/control conditions) — the three are never collapsed
    (§46).
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Controller
  name: Controller
  canonical_name: Controller
  definition: 'Enforces execution, state and control conditions in an agentic system (CR-7 §46): evaluates state, enforces
    policy, controls execution, triggers escalation.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Orchestration
  name: Orchestration
  canonical_name: Orchestration
  definition: A coordinated execution of tasks, agents and services under an Orchestrator (CR-7 §47).
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Workflow
  name: Workflow
  canonical_name: Workflow
  definition: 'An ordered composition of tasks and decisions toward an outcome (CR-7 §47): Task A → Task B → Decision → Task
    C. Workflow ≠ Agent (§57), though a workflow may be part of an agentic system.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Task
  name: Task
  canonical_name: Task
  definition: A unit of work within a Workflow or Orchestration (CR-7 §47).
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AutonomyPolicy
  name: AutonomyPolicy
  canonical_name: AutonomyPolicy
  definition: The policy governing how much autonomy an Agent may exercise (CR-7 §23) — the metamodel models AutonomyPolicy/AutonomyLevel/HumanOversight/ApprovalRequirement
    rather than hard-coding a scale.
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AutonomyLevel
  name: AutonomyLevel
  canonical_name: AutonomyLevel
  definition: One level in a configurable autonomy model (CR-7 §23), e.g. 0 Inform · 1 Recommend · 2 Prepare · 3 Execute-with-approval
    · 4 Execute-within-delegated-authority · 5 Autonomous. The scale is a profile concern, never a boolean.
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:HumanOversight
  name: HumanOversight
  canonical_name: HumanOversight
  definition: 'First-class human oversight of agent behavior (CR-7 §25): approve-before-action, review-after-action, intervene-on-exception,
    continuous supervision — materially different governance patterns.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Approval
  name: Approval
  canonical_name: Approval
  definition: 'An approval act within a human-oversight pattern (CR-7 §25): approver, subject, decision, timestamp. The gate
    between recommendation and action in approve-before patterns.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Escalation
  name: Escalation
  canonical_name: Escalation
  definition: 'An escalation raised when authority, confidence or policy boundaries are exceeded (CR-7 §25; G011): actions
    exceeding an Agent''s authority must escalate or fail safely.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AgenticSystem
  name: AgenticSystem
  canonical_name: AgenticSystem
  definition: 'The architecture boundary of a multi-agent solution (CR-7 §58): a composition of agents, models, tools, services,
    policies, orchestration, memory and human oversight.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:AgentOpportunity
  name: AgentOpportunity
  canonical_name: AgentOpportunity
  definition: 'A derived decision-support object identifying where an agent could create value (CR-7 §56): subject capability,
    potential agent, expected value, risk, readiness, recommended autonomy. Derived — never an architectural entity assumed
    to exist in the target architecture. Links DMM assessment to agentic transformation (§55).'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
- id: dea:Memory
  name: Memory
  canonical_name: Memory
  definition: 'Information retained by or for an Agent (CR-7 §33). The DEA concern is governance, not AI implementation detail:
    what is retained, who controls it, how long, under what policy, who can access it.'
  semantic_category: dea:agentic
  abstract: false
  status: normative
  version: 1.0.0
