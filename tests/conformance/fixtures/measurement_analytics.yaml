causal_hypotheses:
- id: dea:CausalHypothesis-engagement-drives-satisfaction
  type: CausalHypothesis
  name: Engagement Drives Satisfaction
  version: 1.0.0
  lifecycle_status: active
  cause_ref: dea:metric-employee-engagement-score
  effect_ref: dea:metric-customer-satisfaction
  mechanism: Higher employee engagement improves service interaction quality, which raises customer satisfaction scores.
  confidence: 0.34
  uncertainty:
    unmeasured_mediators:
    - dea:metric-service-interaction-quality
    alternative_mechanisms:
    - A shared third factor (market sentiment) raises both engagement and satisfaction.
    - Higher customer satisfaction raises employee engagement (reverse direction).
    inference_method: none_yet
  validation_state: correlation_supported
  supporting_correlation_refs:
  - dea:Correlation-engagement-to-satisfaction
  counter_evidence:
  - observation: Two quarters show satisfaction rising while engagement falls.
    implication: Inconsistent with a strong positive mechanism; may indicate a lag or a reverse causal direction.
  falsification_test: A controlled engagement intervention in one business unit with a holdout group, measuring satisfaction over four quarters.
  responsible_party_ref: dea:Actor-hr-analytics-lead
  scenario: D
- id: dea:CausalHypothesis-load-drives-failure
  type: CausalHypothesis
  name: System Load Drives Incident Frequency
  version: 1.0.0
  lifecycle_status: active
  cause_ref: dea:metric-system-load-factor
  effect_ref: dea:metric-incident-frequency
  mechanism: Sustained load above the saturation threshold exhausts connection pools and raises the failure rate.
  confidence: 0.71
  uncertainty:
    unmeasured_mediators:
    - dea:metric-connection-pool-saturation
    alternative_mechanisms:
    - A deployment burst raises both load and incident count.
    inference_method: threshold_analysis
  validation_state: experiment_running
  supporting_correlation_refs:
  - dea:Correlation-system-load-to-failure
  counter_evidence:
  - observation: Incidents continued at the prior rate during a two-week load plateau.
    implication: The threshold may sit higher than the observed plateau.
  falsification_test: A controlled load-ceiling change in a non-production replica, holding deployment cadence constant.
  responsible_party_ref: dea:Actor-sre-lead
  scenario: C

