    state_transitions:
      - from_state: planned
        to_state: initiated
        transitioned_at: 2026-10-01T00:00:00Z
        guard_satisfied: true
        reason: Scheduled Q3 reporting trigger.
      - from_state: initiated
        to_state: in_progress
        transitioned_at: 2026-10-01T00:00:05Z
        guard_satisfied: true
        reason: Execution begun; customer records acquired.
      - from_state: in_progress
        to_state: pending_validation
        transitioned_at: 2026-10-01T00:00:45Z
        guard_satisfied: true
        reason: Retention calculation produced a candidate result.
      - from_state: pending_validation
        to_state: validated
        transitioned_at: 2026-10-01T00:00:50Z
        guard_satisfied: true
        reason: All validation checks passed.
      - from_state: validated
        to_state: completed
        transitioned_at: 2026-10-01T00:01:00Z
        guard_satisfied: true
        reason: Observation recorded and published.
    description: >
      Canonical completed lifecycle. Full transition chain planned ->
      initiated -> in_progress -> pending_validation -> validated ->
      completed. Execution mode: calculated.
