# CR-MET-004 representative Measurement lifecycle fixtures.
# 6 representative lifecycle records covering: completed, failed, rejected,
# cancelled, ai_assisted, and superseded. Consumed by
# tests/conformance/test_024_measurement_lifecycle.py.
version: 1.0.0
measurements:
