# CR-MET-010 section 8: the semantic-change assessment process. Each entry records
# the changed attribute, the severity classification, and the disposition.
changes:
- metric_ref: dea:metric-governed-net-revenue-yield
  changed_attribute: description
  from_value: Net revenue divided by total revenue.
  to_value: Net revenue divided by total revenue, excluding pass-through.
  change_severity: cosmetic
  semantic_change_disposition: revise_in_place
  new_identity_required: false
  rationale: Wording clarification; the calculation is unchanged.

- metric_ref: dea:metric-governed-net-revenue-yield
  changed_attribute: unit_ref
  from_value: dea:unit-ratio-percent
  to_value: dea:unit-ratio
  change_severity: substantive
  semantic_change_disposition: new_version
  new_identity_required: false
  rationale: The output scale changed; a minor version bump is required.

- metric_ref: dea:metric-governed-process-throughput
  changed_attribute: subject_concept
  from_value: dea:subject-throughput
  to_value: dea:subject-cycle-time
  change_severity: semantic_breaking
  semantic_change_disposition: new_identity
  new_identity_required: true
  rationale: >
    The measured phenomenon changed; representing this as a version bump would
    disguise a semantic break behind a cosmetic update (CR-MET-010 section 8).

- metric_ref: dea:metric-governed-incident-recovery
  changed_attribute: formula_definition.expression
  from_value: MTTR = (sum_i RecoveryTime_i) / n
  to_value: MTTR = (sum_i RecoveryTime_i) / n; detection latency excluded
  change_severity: substantive
  semantic_change_disposition: deprecate
  new_identity_required: true
  rationale: >
    The prior definition is deprecated and a replacement Metric identity carries the
    corrected window; historical Observations retain their original context.

- metric_ref: dea:metric-governed-deprecated-completion-rate
  changed_attribute: lifecycle_status
  from_value: active
  to_value: retired
  change_severity: cosmetic
  semantic_change_disposition: replace
  new_identity_required: false
  rationale: A replacement relationship points at the successor Metric.